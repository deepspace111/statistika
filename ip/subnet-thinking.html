<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Subnet Thinking Station</title>

<link href="https://fonts.googleapis.com/css2?family=Yuji+Mai&display=swap" rel="stylesheet">

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  height:100vh;
  overflow:hidden;
  font-family:Arial,sans-serif;
  background:
    radial-gradient(circle at top, rgba(80,130,220,0.10), transparent 42%),
    linear-gradient(to bottom, #03060a, #000814 48%, #000 100%);
  color:rgba(225,230,245,0.86);
}

/* דו */
#homeBtn{
  position:fixed;
  top:16px;
  left:18px;

  text-decoration:none;

  font-family:"Yuji Mai",serif;
  font-size:32px;
  line-height:1;

  color:rgba(225,225,225,0.62);

  z-index:20;

  transition:0.5s ease;
}

#homeBtn:hover{
  transform:scale(1.06);
  color:rgba(255,255,255,0.92);
}

/* גשם */
#rain{
  position:fixed;
  inset:0;
  pointer-events:none;
  z-index:0;
  opacity:0.18;
  overflow:hidden;
}

.drop{
  position:absolute;
  top:-120vh;
  width:1px;
  height:80px;
  background:linear-gradient(
    to bottom,
    rgba(120,170,255,0),
    rgba(120,170,255,0.22),
    rgba(120,170,255,0)
  );
  animation:rain linear infinite;
}

@keyframes rain{
  from{ transform:translateY(-10vh); }
  to{ transform:translateY(140vh); }
}

/* במה */
.scene{
  position:relative;
  z-index:2;
  width:100%;
  height:100vh;

  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;

  perspective:900px;
}

/* כתובת */
.transform-box{
  text-align:center;
  animation:spinTransform 14s ease-in-out infinite;
  transform-style:preserve-3d;
}

.ip{
  font-size:58px;
  letter-spacing:7px;
  font-weight:200;
  text-shadow:0 0 22px rgba(120,170,255,0.20);
}

.mask{
  margin-top:22px;
  font-size:32px;
  letter-spacing:5px;
  color:rgba(180,195,255,0.72);
}

.decimal{
  animation:decimalFade 14s ease-in-out infinite;
}

.binary{
  position:absolute;
  inset:0;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;

  opacity:0;
  animation:binaryFade 14s ease-in-out infinite;
}

.binary .ip{
  font-size:28px;
  letter-spacing:5px;
  color:rgba(130,180,255,0.92);
}

.binary .mask{
  font-size:24px;
  letter-spacing:4px;
  color:rgba(220,225,255,0.75);
}

/* סיבוב */
@keyframes spinTransform{
  0%{
    transform:rotateY(0deg) scale(1);
  }

  25%{
    transform:rotateY(80deg) scale(1.04);
  }

  45%{
    transform:rotateY(190deg) scale(1.10);
  }

  65%{
    transform:rotateY(310deg) scale(1.08);
  }

  82%{
    transform:rotateY(360deg) scale(1);
  }

  100%{
    transform:rotateY(360deg) scale(1);
  }
}

@keyframes decimalFade{
  0%,35%{ opacity:1; }
  50%,100%{ opacity:0; }
}

@keyframes binaryFade{
  0%,38%{ opacity:0; }
  55%,100%{ opacity:1; }
}

/* משפט */
.caption{
  position:absolute;
  bottom:23vh;
  text-align:center;
  font-size:17px;
  line-height:2.1;
  letter-spacing:1px;
  color:rgba(215,220,235,0.74);
  animation:captionFade 14s ease-in-out infinite;
}

@keyframes captionFade{
  0%,25%{ opacity:0; transform:translateY(12px); }
  45%,82%{ opacity:1; transform:translateY(0); }
  100%{ opacity:0; transform:translateY(12px); }
}

/* גבול */
.boundary{
  position:absolute;
  bottom:11vh;
  display:flex;
  gap:54px;
  font-size:20px;
  letter-spacing:3px;
  color:rgba(170,205,255,0.82);
  opacity:0;
  animation:boundaryFade 14s ease-in-out infinite;
}

@keyframes boundaryFade{
  0%,58%{
    opacity:0;
    transform:translateY(18px);
  }

  72%,100%{
    opacity:1;
    transform:translateY(0);
  }
}

/* מובייל */
@media(max-width:700px){
  .ip{
    font-size:30px;
    letter-spacing:3px;
  }

  .mask{
    font-size:20px;
    letter-spacing:2px;
  }

  .binary .ip{
    font-size:14px;
    letter-spacing:1px;
  }

  .binary .mask{
    font-size:13px;
    letter-spacing:1px;
  }

  .caption{
    font-size:14px;
    padding:0 22px;
  }

  .boundary{
    font-size:14px;
    gap:18px;
  }
}
</style>
</head>

<body>

<div id="rain"></div>

<a href="../ccna.html" id="homeBtn">道</a>

<div class="scene">

  <div class="transform-box">

    <div class="decimal">
      <div class="ip">192.168.1.8</div>
      <div class="mask">255.255.255.128</div>
    </div>

    <div class="binary">
      <div class="ip">11000000.10101000.00000001.00001000</div>
      <div class="mask">11111111.11111111.11111111.10000000</div>
    </div>

  </div>

  <div class="caption">
    הכתובת מסתובבת סביב עצמה.<br>
    המספרים נפתחים לביטים.<br>
    ה־Subnet Mask מגלה את הגבול.
  </div>

  <div class="boundary">
    <div>0 ─────── 127</div>
    <div>128 ───── 255</div>
  </div>

</div>

<script>
const rain = document.getElementById("rain");

for(let i = 0; i < 85; i++){
  const drop = document.createElement("div");

  drop.classList.add("drop");

  drop.style.left = Math.random() * 100 + "vw";
  drop.style.height = 40 + Math.random() * 90 + "px";
  drop.style.opacity = 0.04 + Math.random() * 0.12;
  drop.style.animationDuration = 4 + Math.random() * 7 + "s";
  drop.style.animationDelay = Math.random() * -8 + "s";

  rain.appendChild(drop);
}
</script>

</body>
</html>
