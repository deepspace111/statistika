<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>תחנת חשיבה — Subnet Binary</title>

<link href="https://fonts.googleapis.com/css2?family=Yuji+Mai&display=swap" rel="stylesheet">

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  min-height:100vh;
  overflow:hidden;

  background:
    radial-gradient(circle at 50% 70%, rgba(20,55,95,0.24), transparent 42%),
    radial-gradient(circle at 20% 16%, rgba(35,75,120,0.14), transparent 35%),
    #02040a;

  color:rgba(220,235,255,0.84);

  font-family:Arial,sans-serif;
}

body::after{
  content:"";

  position:fixed;
  inset:0;

  pointer-events:none;

  background:rgba(150,190,255,0);

  animation:softPulse 15s infinite;

  z-index:1;
}

@keyframes softPulse{

  0%,84%,100%{
    background:rgba(150,190,255,0);
  }

  85%{
    background:rgba(150,190,255,0.03);
  }

  87%{
    background:rgba(150,190,255,0);
  }
}

#homeBtn{
  position:fixed;

  top:16px;
  left:18px;

  text-decoration:none;

  font-family:
    "Yuji Mai",
    serif;

  font-size:32px;

  color:rgba(210,225,245,0.44);

  z-index:30;

  line-height:1;
}

.stage{
  position:relative;

  min-height:100vh;

  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;

  text-align:center;

  padding:24px;

  z-index:10;
}

.smallTitle{
  position:absolute;

  top:15%;

  font-size:13px;

  letter-spacing:0.24em;

  color:rgba(210,225,245,0.28);
}

.rowLabel{
  margin-bottom:10px;

  font-size:12px;

  letter-spacing:0.22em;

  color:rgba(210,225,245,0.24);
}

.grid{
  display:grid;

  grid-template-columns:
    repeat(4,minmax(70px,160px));

  gap:clamp(12px,3vw,34px);

  direction:ltr;

  margin-bottom:34px;
}

.cell{
  position:relative;

  height:72px;

  display:flex;
  align-items:center;
  justify-content:center;

  font-family:"Courier New", monospace;
}

.decimal,
.binary{
  position:absolute;

  inset:0;

  display:flex;
  align-items:center;
  justify-content:center;

  transition:
    opacity 1.8s ease,
    transform 1.8s ease,
    text-shadow 1.8s ease;

  white-space:nowrap;
}

.decimal{
  opacity:1;

  transform:
    rotateX(0deg)
    translateY(0);

  font-size:clamp(24px,5vw,52px);

  color:rgba(235,242,255,0.9);

  text-shadow:
    0 0 18px rgba(120,170,255,0.12);
}

.binary{
  opacity:0;

  transform:
    rotateX(-90deg)
    translateY(18px);

  font-size:clamp(13px,2vw,24px);

  color:rgba(155,205,255,0.92);

  letter-spacing:0.08em;
}

body.binary .decimal{
  opacity:0;

  transform:
    rotateX(90deg)
    translateY(-18px);
}

body.binary .binary{
  opacity:1;

  transform:
    rotateX(0deg)
    translateY(0);

  text-shadow:
    0 0 24px rgba(105,175,255,0.48);
}

body:not(.binary) .decimal{
  opacity:1;

  transform:
    rotateX(0deg)
    translateY(0);
}

body:not(.binary) .binary{
  opacity:0;

  transform:
    rotateX(-90deg)
    translateY(18px);
}

.network{
  margin-top:4px;

  font-family:"Courier New", monospace;

  line-height:2;

  font-size:clamp(15px,2.2vw,22px);

  color:rgba(220,232,250,0.52);

  opacity:0;

  transform:translateY(10px);

  transition:1.6s ease;
}

body.binary .network{
  opacity:1;

  transform:translateY(0);
}

.taken{
  color:white;

  text-shadow:
    0 0 24px rgba(120,185,255,0.92);
}

.ranges{
  margin-top:28px;

  line-height:2;

  font-family:"Courier New", monospace;

  font-size:clamp(16px,2.3vw,24px);

  color:rgba(220,232,250,0.58);

  opacity:0;

  transition:1.8s ease;
}

body.binary .ranges{
  opacity:1;
}

.maskWrap{
  position:absolute;

  top:50%;

  transform:translateY(-50%);

  width:130px;
  height:180px;

  cursor:pointer;

  z-index:25;
}

.maskLeft{
  left:11%;
}

.maskRight{
  right:11%;
}

.mask{
  position:absolute;

  inset:0;

  border-radius:
    44% 44% 46% 46% /
    36% 36% 58% 58%;

  background:
    linear-gradient(
      to bottom,
      rgba(210,220,235,0.16),
      rgba(120,135,150,0.08)
    );

  border:
    1px solid rgba(215,225,245,0.14);

  box-shadow:
    inset 0 0 28px rgba(255,255,255,0.04),
    0 0 20px rgba(80,130,200,0.05);

  overflow:hidden;

  opacity:0.56;

  transition:
    opacity 1s ease,
    transform 1s ease;
}

.maskWrap:hover .mask{
  opacity:0.78;
}

.mask::after{
  content:"";

  position:absolute;

  inset:-40%;

  background:
    linear-gradient(
      105deg,
      transparent 42%,
      rgba(200,220,255,0.18),
      transparent 58%
    );

  transform:translateX(-140%);

  animation:wave 8s infinite;
}

@keyframes wave{

  0%,56%,100%{
    transform:translateX(-140%);
  }

  70%{
    transform:translateX(140%);
  }
}

.eye{
  position:absolute;

  top:58px;

  width:22px;
  height:5px;

  border-radius:50%;

  background:
    rgba(220,232,250,0.12);

  overflow:hidden;

  transition:
    height 0.6s ease,
    background 0.6s ease;
}

.eyeLeft{
  left:33px;
}

.eyeRight{
  right:33px;
}

.pupil{
  position:absolute;

  top:50%;
  left:50%;

  width:6px;
  height:6px;

  border-radius:50%;

  background:
    rgba(240,245,255,0.72);

  transform:translate(-50%,-50%);

  opacity:0;

  transition:0.4s ease;
}

body.awake .eye{
  height:16px;

  background:
    rgba(220,232,250,0.22);
}

body.awake .pupil{
  opacity:1;
}

.mouth{
  position:absolute;

  left:50%;
  bottom:48px;

  transform:translateX(-50%);

  transition:1s ease;
}

.maskRight .mouth{
  width:44px;
  height:20px;

  border-bottom:
    2px solid rgba(225,240,255,0.16);

  border-radius:
    0 0 44px 44px;
}

body.binary .maskRight .mouth{
  border-bottom:
    2px solid rgba(240,248,255,0.42);

  height:28px;
}

.maskLeft .mouth{
  width:40px;
  height:18px;

  border-top:
    2px solid rgba(225,240,255,0.14);

  border-radius:
    40px 40px 0 0;
}

@media(max-width:900px){

  .maskWrap{
    width:92px;
    height:130px;
  }

  .maskLeft{
    left:2%;
  }

  .maskRight{
    right:2%;
  }

  .eye{
    top:42px;
  }

  .eyeLeft{
    left:22px;
  }

  .eyeRight{
    right:22px;
  }

  .mouth{
    bottom:32px;
  }

  .grid{
    grid-template-columns:
      repeat(2,minmax(100px,1fr));
  }
}

</style>
</head>

<body>

<a href="subnet.html" id="homeBtn">道</a>

<audio id="hum">
  <source src="hum.mp3" type="audio/mpeg">
</audio>

<main class="stage">

  <div class="smallTitle">
    תחנת חשיבה — Subnet
  </div>

  <div class="rowLabel">
    IP ADDRESS
  </div>

  <section class="grid">

    <div class="cell">
      <div class="decimal">192</div>
      <div class="binary">11000000</div>
    </div>

    <div class="cell">
      <div class="decimal">168</div>
      <div class="binary">10101000</div>
    </div>

    <div class="cell">
      <div class="decimal">1</div>
      <div class="binary">00000001</div>
    </div>

    <div class="cell">
      <div class="decimal">130</div>
      <div class="binary">10000010</div>
    </div>

  </section>

  <div class="rowLabel">
    SUBNET MASK
  </div>

  <section class="grid">

    <div class="cell">
      <div class="decimal">255</div>
      <div class="binary">11111111</div>
    </div>

    <div class="cell">
      <div class="decimal">255</div>
      <div class="binary">11111111</div>
    </div>

    <div class="cell">
      <div class="decimal">255</div>
      <div class="binary">11111111</div>
    </div>

    <div class="cell">
      <div class="decimal">128</div>
      <div class="binary">
        <span class="taken">1</span>0000000
      </div>
    </div>

  </section>

  <div class="network">

    Network | Host

    <br><br>

    הביט הראשון עבר לחלק הרשת

  </div>

  <div class="ranges">

    0xxxxxxx → 0 - 127

    <br>

    1xxxxxxx → 128 - 255

  </div>

</main>

<div class="maskWrap maskLeft" id="decimalBtn">

  <div class="mask">

    <div class="eye eyeLeft">
      <div class="pupil"></div>
    </div>

    <div class="eye eyeRight">
      <div class="pupil"></div>
    </div>

    <div class="mouth"></div>

  </div>

</div>

<div class="maskWrap maskRight" id="binaryBtn">

  <div class="mask">

    <div class="eye eyeLeft">
      <div class="pupil"></div>
    </div>

    <div class="eye eyeRight">
      <div class="pupil"></div>
    </div>

    <div class="mouth"></div>

  </div>

</div>

<script>

const hum =
  document.getElementById("hum");

const binaryBtn =
  document.getElementById("binaryBtn");

const decimalBtn =
  document.getElementById("decimalBtn");

let sleepTimer;
let humFadeTimer = null;

function wakeMasks(){

  document.body.classList.add("awake");

  clearTimeout(sleepTimer);

  sleepTimer = setTimeout(()=>{

    document.body.classList.remove("awake");

  },2600);
}

document.addEventListener("mousemove",(e)=>{

  wakeMasks();

  document
    .querySelectorAll(".eye")
    .forEach((eye)=>{

      const pupil =
        eye.querySelector(".pupil");

      const rect =
        eye.getBoundingClientRect();

      const eyeX =
        rect.left + rect.width/2;

      const eyeY =
        rect.top + rect.height/2;

      const dx =
        Math.max(
          -4,
          Math.min(
            4,
            (e.clientX-eyeX)/35
          )
        );

      const dy =
        Math.max(
          -3,
          Math.min(
            3,
            (e.clientY-eyeY)/45
          )
        );

      pupil.style.transform =
        `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;

    });
});

function clearHumFade(){

  if(humFadeTimer){

    clearInterval(humFadeTimer);

    humFadeTimer = null;
  }
}

function startHum(){

  clearHumFade();

  hum.pause();

  hum.currentTime = 0;

  hum.volume = 0;

  hum.play().catch(()=>{});

  let v = 0;

  humFadeTimer =
    setInterval(()=>{

      v += 0.003;

      if(v >= 0.12){

        v = 0.12;

        clearHumFade();
      }

      hum.volume = v;

    },90);
}

function stopHum(){

  clearHumFade();

  humFadeTimer =
    setInterval(()=>{

      if(hum.volume > 0.01){

        hum.volume =
          Math.max(
            0,
            hum.volume - 0.004
          );

      }else{

        hum.pause();

        hum.currentTime = 0;

        hum.volume = 0;

        clearHumFade();
      }

    },90);
}

function showBinary(){

  wakeMasks();

  startHum();

  setTimeout(()=>{

    document.body.classList.add("binary");

  },900);
}

function showDecimal(){

  wakeMasks();

  document.body.classList.remove("binary");

  stopHum();

  document
    .querySelectorAll(".decimal")
    .forEach((item)=>{

      item.style.opacity = "";
      item.style.transform = "";
    });

  document
    .querySelectorAll(".binary")
    .forEach((item)=>{

      item.style.opacity = "";
      item.style.transform = "";
    });
}

binaryBtn.addEventListener("click",showBinary);

decimalBtn.addEventListener("click",showDecimal);

</script>

</body>
</html>
