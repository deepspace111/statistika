<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>תחנת חשיבה — Subnet Binary</title>

<link href="https://fonts.googleapis.com/css2?family=Yuji+Mai&display=swap" rel="stylesheet">

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  min-height:100vh;
  overflow:hidden;
  background:
    radial-gradient(circle at 50% 68%, rgba(18,52,92,0.24), transparent 43%),
    radial-gradient(circle at 20% 18%, rgba(25,70,120,0.13), transparent 36%),
    #02040a;
  color:rgba(220,235,255,0.82);
  font-family:Arial, sans-serif;
}

body::after{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  background:rgba(130,170,230,0);
  animation:softPulse 14s infinite;
  z-index:2;
}

@keyframes softPulse{
  0%,82%,100%{ background:rgba(130,170,230,0); }
  84%{ background:rgba(130,170,230,0.035); }
  86%{ background:rgba(130,170,230,0); }
}

#homeBtn{
  position:fixed;
  top:16px;
  left:18px;
  text-decoration:none;
  font-family:"Yuji Mai", serif;
  font-size:32px;
  color:rgba(210,225,245,0.42);
  z-index:30;
  line-height:1;
}

.stage{
  position:relative;
  min-height:100vh;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  text-align:center;
  padding:24px;
  z-index:10;
}

.small-title{
  position:absolute;
  top:18%;
  font-size:13px;
  letter-spacing:0.22em;
  color:rgba(210,225,245,0.32);
}

.subLabel{
  margin-bottom:10px;
  font-size:13px;
  letter-spacing:0.18em;
  color:rgba(210,225,245,0.28);
}

.grid{
  display:grid;
  grid-template-columns:repeat(4, minmax(68px, 150px));
  gap:clamp(12px, 3vw, 34px);
  direction:ltr;
  margin:8px 0 28px;
}

.cell{
  position:relative;
  min-height:66px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-family:"Courier New", monospace;
  font-size:clamp(22px, 4.8vw, 46px);
  color:rgba(235,242,255,0.88);
  text-shadow:0 0 18px rgba(120,170,255,0.14);
}

.cell .dec,
.cell .bin{
  position:absolute;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  transition:
    opacity 1.2s ease,
    transform 1.6s ease,
    text-shadow 1.6s ease,
    color 1.6s ease;
}

.cell .bin{
  opacity:0;
  transform:translateY(14px) rotateX(-72deg);
  color:rgba(150,205,255,0.92);
  font-size:clamp(15px, 2.4vw, 25px);
}

body.binary .cell .dec{
  opacity:0;
  transform:translateY(-18px) rotateX(82deg);
}

body.binary .cell .bin{
  opacity:1;
  transform:translateY(0) rotateX(0deg);
  text-shadow:0 0 22px rgba(105,175,255,0.42);
}

.maskRow{
  margin-top:8px;
  opacity:0.82;
}

.networkHint{
  margin-top:18px;
  font-family:"Courier New", monospace;
  font-size:clamp(15px, 2.2vw, 22px);
  color:rgba(210,225,245,0.46);
  opacity:0;
  transform:translateY(10px);
  transition:1.4s ease;
}

body.binary .networkHint{
  opacity:1;
  transform:translateY(0);
}

.takenBit{
  color:rgba(255,255,255,0.96);
  text-shadow:0 0 20px rgba(120,185,255,0.8);
}

.ranges{
  margin-top:22px;
  line-height:2;
  font-family:"Courier New", monospace;
  font-size:clamp(16px, 2.4vw, 24px);
  color:rgba(210,225,245,0.58);
  opacity:0;
  transition:1.7s ease;
}

body.binary .ranges{
  opacity:1;
}

/* מסכות */
.maskNav{
  position:fixed;
  top:50%;
  width:92px;
  height:118px;
  transform:translateY(-50%);
  z-index:25;
  cursor:pointer;
  opacity:0.38;
  transition:opacity 0.8s ease, transform 0.8s ease;
}

.maskNav:hover{
  opacity:0.78;
}

.maskLeft{
  left:26px;
}

.maskRight{
  right:26px;
}

.face{
  position:absolute;
  inset:0;
  border-radius:48% 48% 44% 44%;
  background:
    radial-gradient(circle at 50% 38%, rgba(180,195,220,0.13), transparent 38%),
    rgba(120,132,150,0.055);
  border:1px solid rgba(175,190,215,0.10);
  box-shadow:
    inset 0 0 26px rgba(210,225,245,0.035),
    0 0 18px rgba(80,130,200,0.045);
  overflow:hidden;
}

.face::after{
  content:"";
  position:absolute;
  inset:-40%;
  background:linear-gradient(105deg, transparent 42%, rgba(190,215,255,0.16), transparent 58%);
  transform:translateX(-120%);
  animation:waveReveal 8s infinite;
}

@keyframes waveReveal{
  0%,55%,100%{ transform:translateX(-120%); }
  68%{ transform:translateX(120%); }
}

.eye{
  position:absolute;
  top:38px;
  width:18px;
  height:6px;
  border-radius:50%;
  background:rgba(210,225,245,0.08);
  overflow:hidden;
  transition:height 0.6s ease, background 0.6s ease;
}

.eye.leftEye{ left:25px; }
.eye.rightEye{ right:25px; }

.pupil{
  position:absolute;
  top:50%;
  left:50%;
  width:5px;
  height:5px;
  border-radius:50%;
  background:rgba(220,235,255,0.65);
  transform:translate(-50%,-50%);
  opacity:0;
  transition:opacity 0.5s ease;
}

body.awake .eye{
  height:14px;
  background:rgba(210,225,245,0.18);
}

body.awake .pupil{
  opacity:1;
}

.mouth{
  position:absolute;
  left:50%;
  bottom:34px;
  width:34px;
  height:14px;
  border-bottom:2px solid rgba(210,225,245,0.12);
  border-radius:0 0 40px 40px;
  transform:translateX(-50%);
  transition:0.8s ease;
}

.maskRight .mouth{
  border-bottom-color:rgba(210,225,245,0.17);
}

body.binary .maskRight .mouth{
  height:20px;
  width:42px;
  border-bottom-color:rgba(225,240,255,0.34);
}

body.binary .maskLeft .mouth{
  border-bottom:0;
  border-top:2px solid rgba(210,225,245,0.13);
  border-radius:40px 40px 0 0;
}

.hint{
  position:absolute;
  top:124px;
  left:50%;
  transform:translateX(-50%);
  font-size:11px;
  white-space:nowrap;
  color:rgba(210,225,245,0.26);
  letter-spacing:0.12em;
}

@media(max-width:760px){
  .grid{
    grid-template-columns:repeat(2, minmax(90px, 1fr));
  }

  .maskNav{
    width:70px;
    height:92px;
    opacity:0.32;
  }

  .maskLeft{ left:12px; }
  .maskRight{ right:12px; }

  .hint{
    display:none;
  }
}
</style>
</head>

<body>

<a href="subnet.html" id="homeBtn">道</a>

<audio id="hum">
  <source src="hum.mp3" type="audio/mpeg">
</audio>

<main class="stage">

  <div class="small-title">תחנת חשיבה — Subnet</div>

  <div class="subLabel">IP ADDRESS</div>

  <section class="grid ipGrid">
    <div class="cell"><span class="dec">192</span><span class="bin">11000000</span></div>
    <div class="cell"><span class="dec">168</span><span class="bin">10101000</span></div>
    <div class="cell"><span class="dec">1</span><span class="bin">00000001</span></div>
    <div class="cell"><span class="dec">130</span><span class="bin">10000010</span></div>
  </section>

  <div class="subLabel">SUBNET MASK</div>

  <section class="grid maskRow">
    <div class="cell"><span class="dec">255</span><span class="bin">11111111</span></div>
    <div class="cell"><span class="dec">255</span><span class="bin">11111111</span></div>
    <div class="cell"><span class="dec">255</span><span class="bin">11111111</span></div>
    <div class="cell"><span class="dec">128</span><span class="bin"><span class="takenBit">1</span>0000000</span></div>
  </section>

  <div class="networkHint">
    Network | Host<br>
    הביט הראשון עבר לחלק הרשת
  </div>

  <div class="ranges">
    0xxxxxxx&nbsp;&nbsp;→&nbsp;&nbsp;0 - 127<br>
    1xxxxxxx&nbsp;&nbsp;→&nbsp;&nbsp;128 - 255
  </div>

</main>

<div class="maskNav maskLeft" id="toDecimal" title="חזרה לדצימלי">
  <div class="face">
    <div class="eye leftEye"><div class="pupil"></div></div>
    <div class="eye rightEye"><div class="pupil"></div></div>
    <div class="mouth"></div>
  </div>
  <div class="hint">Decimal</div>
</div>

<div class="maskNav maskRight" id="toBinary" title="מעבר לבינארי">
  <div class="face">
    <div class="eye leftEye"><div class="pupil"></div></div>
    <div class="eye rightEye"><div class="pupil"></div></div>
    <div class="mouth"></div>
  </div>
  <div class="hint">Binary</div>
</div>

<script>
const hum = document.getElementById("hum");
const toBinary = document.getElementById("toBinary");
const toDecimal = document.getElementById("toDecimal");

let sleepTimer;

function wakeMasks(){
  document.body.classList.add("awake");
  clearTimeout(sleepTimer);
  sleepTimer = setTimeout(() => {
    document.body.classList.remove("awake");
  }, 2600);
}

document.addEventListener("mousemove", (e) => {
  wakeMasks();

  document.querySelectorAll(".eye").forEach((eye) => {
    const pupil = eye.querySelector(".pupil");
    const rect = eye.getBoundingClientRect();

    const eyeX = rect.left + rect.width / 2;
    const eyeY = rect.top + rect.height / 2;

    const dx = Math.max(-4, Math.min(4, (e.clientX - eyeX) / 35));
    const dy = Math.max(-3, Math.min(3, (e.clientY - eyeY) / 45));

    pupil.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
  });
});

function playHum(){
  hum.pause();
  hum.currentTime = 0;
  hum.volume = 0.09;
  hum.play().catch(() => {});
}

function stopHumSoftly(){
  const fade = setInterval(() => {
    if(hum.volume > 0.01){
      hum.volume = Math.max(0, hum.volume - 0.01);
    }else{
      hum.pause();
      hum.currentTime = 0;
      clearInterval(fade);
    }
  }, 90);
}

toBinary.addEventListener("click", () => {
  document.body.classList.add("binary");
  playHum();
});

toDecimal.addEventListener("click", () => {
  document.body.classList.remove("binary");
  stopHumSoftly();
});
</script>

</body>
</html>
