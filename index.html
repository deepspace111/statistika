<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>דרך לימוד</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@200&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #e8e8e8;
      color: #111;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    
   .title-btn span {
  font-family: 'Noto Sans JP', sans-serif;
  font-weight: 200;
  font-size: 20px;
  opacity: 0.5;
  margin-right: 8px;
  position: relative;
  top: -5px;
}
    .container {
      text-align: center;
    }

    .title-btn {
      display: block;
      font-size: 36px;
      margin-bottom: 20px;
      text-decoration: none;
      color: #111;
      font-weight: bold;
    }

    .title-btn:hover {
      opacity: 0.7;
    }

   
    /* מצב ריכוז */
    body.focus-mode {
      background: #111;
      color: #e8e8e8;
    }

    body.focus-mode .btn {
      background: #e8e8e8;
      color: #111;
    }

    body.focus-mode .title-btn {
      color: #e8e8e8;
    }

    .subtitle-btn {
      margin-bottom: 40px;
      background: none;
      border: none;
      color: #555;
      font-size: 18px;
      cursor: pointer;
    }

    .subtitle-btn:hover {
      color: #111;
    }

    body.focus-mode .subtitle-btn {
      color: #e8e8e8;
    }

    .btn {
      display: inline-block;
      padding: 18px 40px;
      margin: 10px;
      border-radius: 30px;
      text-decoration: none;
      font-size: 18px;
      transition: 0.3s;
      background: #111;
      color: white;
    }

    .btn:hover {
      background: #333;
      transform: scale(1.05);
    }
  </style>
  
</head>

<body>
<span id="focusBtn_old" style="cursor:pointer; display:block; margin-top:20px;">
  כשמבינים—רואים
</span>
  <div class="container">
  
  <a href="#" id="focusBtn" class="title-btn">
  כשמבינים רואים <span>道</span>
</a>

  

  <audio id="brownNoise" src="brown-noise.mp3" loop></audio>

  <a class="btn" href="statistika.html">סטטיסטיקה</a>
  <a class="btn" href="ccna.html">CCNA</a>

</div>

  <script>
  const focusBtn = document.getElementById("focusBtn");
  const brownNoise = document.getElementById("brownNoise");

  focusBtn.addEventListener("click", function (e) {
    e.preventDefault();

    document.body.classList.toggle("focus-mode");

    if (brownNoise.paused) {
      brownNoise.play();
      localStorage.setItem("soundOn", "true");
    } else {
      brownNoise.pause();
      localStorage.setItem("soundOn", "false");
    }
  });
</script>



</body>
</html>
