<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>מבוא לסטטיסטיקה תיאורית</title>

  <style>
    body {
      margin: 0;
      font-family: Arial;
      background: #e5e5e5;
      color: #111;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .box {
      background: #fff;
      padding: 30px;
      border-radius: 15px;
      text-align: center;
      max-width: 500px;
      width: 90%;
    }

    button {
      margin-top: 15px;
      padding: 10px 20px;
      cursor: pointer;
    }

    .focus {
      background: #1d1b19;
      color: white;
    }
  </style>
</head>
<body>

<div class="box" id="app"></div>

<script>
let focus = false;
let audio;

const pages = {
  home: `
    <h1>ברוכים הבאים</h1>
    <p>נלמד סטטיסטיקה בצורה פשוטה</p>
    <button onclick="go('intro')">למה צריך סטטיסטיקה</button>
    <button onclick="toggle()">מצב ריכוז</button>
  `,

  intro: `
    <h1>למה צריך סטטיסטיקה?</h1>
    <p>כדי להבין נתונים בצורה פשוטה.</p>
    <p>לדוגמה: ציונים, משכורות, זמני נסיעה.</p>
    <button onclick="go('symbols')">לסימנים</button>
    <button onclick="go('home')">חזרה</button>
    <button onclick="toggle()">מצב ריכוז</button>
  `,

  symbols: `
    <h1>אלפא</h1>
    <p>סיכוי לטעות ולהגיד שיש כשאין</p>
    <button onclick="go('home')">חזרה</button>
    <button onclick="toggle()">מצב ריכוז</button>
  `
};

function go(p){
  document.getElementById("app").innerHTML = pages[p];
}

function toggle(){
  focus = !focus;
  document.body.classList.toggle("focus");

  if(!audio){
    audio = new Audio("https://cdn.pixabay.com/download/audio/2022/03/15/audio_115b9b0f3c.mp3?filename=brown-noise-ambient-110624.mp3");
    audio.loop = true;
  }

  if(focus){
    audio.play().catch(()=>{});
  } else {
    audio.pause();
  }
}

go("home");
</script>

</body>
</html>
