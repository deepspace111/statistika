<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>מבוא לסטטיסטיקה תיאורית</title>

  <style>
    :root {
      --bg: #e5e5e5;
      --panel: #f2f2f2;
      --text: #111111;
      --muted: #555555;
      --line: #cfcfcf;
      --shadow: 0 8px 24px rgba(0, 0, 0, 0.06);
      --radius: 18px;
      --max: 900px;
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
      transition: background 0.35s ease, color 0.35s ease;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .wrapper {
      width: 100%;
      max-width: var(--max);
    }

    .hero {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 48px 28px;
      text-align: center;
      opacity: 1;
      transform: scale(1);
      transition:
        opacity 0.4s ease,
        transform 0.4s ease,
        background 0.35s ease,
        border-color 0.35s ease,
        box-shadow 0.35s ease;
    }

    h1 {
      margin: 0 0 18px;
      font-size: 2.4rem;
      font-weight: 700;
      letter-spacing: 0.3px;
    }

    h2 {
      margin: 0 0 16px;
      font-size: 1.35rem;
    }

    .subtitle {
      margin: 0 auto 34px;
      max-width: 680px;
      font-size: 1.08rem;
      line-height: 1.9;
      color: var(--muted);
      transition: color 0.35s ease;
    }

    .guide,
    .card {
      margin: 0 auto;
      max-width: 720px;
      text-align: right;
      background: rgba(255, 255, 255, 0.35);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 24px 20px;
      transition:
        background 0.35s ease,
        border-color 0.35s ease;
    }

    .guide p,
    .card p,
    .card li {
      margin: 0 0 14px;
      line-height: 1.95;
      font-size: 1.02rem;
    }

    .guide p:last-child,
    .card p:last-child,
    .card li:last-child {
      margin-bottom: 0;
    }

    .actions {
      margin-top: 28px;
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
    }

    button {
      border: 1px solid var(--line);
      background: #ffffff;
      color: var(--text);
      padding: 12px 22px;
      border-radius: 12px;
      cursor: pointer;
      font-size: 1rem;
      transition:
        transform 0.2s ease,
        box-shadow 0.2s ease,
        background 0.35s ease,
        color 0.35s ease,
        border-color 0.35s ease;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.05);
    }

    button:hover {
      transform: translateY(-1px);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.08);
      background: #fafafa;
    }

    .note {
      margin-top: 28px;
      text-align: center;
      color: var(--muted);
      font-size: 0.96rem;
      transition: color 0.35s ease;
    }

    .symbol {
      font-size: 2rem;
      font-weight: 700;
      text-align: center;
      margin-bottom: 16px;
    }

    .focus-mode {
      background: #1d1b19;
      color: #f3eee8;
    }

    .focus-mode .hero {
      background: #2a2623;
      border-color: #4a433d;
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.25);
    }

    .focus-mode .subtitle,
    .focus-mode .note {
      color: #d1c7bc;
    }

    .focus-mode .guide,
    .focus-mode .card {
      background: rgba(255, 248, 240, 0.04);
      border-color: #4a433d;
    }

    .focus-mode button {
      background: #3a342f;
      color: #f3eee8;
      border-color: #5a5149;
    }

    .focus-mode button:hover {
      background: #443d37;
    }

    @media (max-width: 640px) {
      body {
        padding: 16px;
        align-items: flex-start;
      }

      .hero {
        padding: 34px 18px;
        margin-top: 18px;
      }

      h1 {
        font-size: 2rem;
        line-height: 1.3;
      }

      .subtitle,
      .guide p,
      .card p,
      .card li {
        font-size: 1rem;
      }

      h2 {
        font-size: 1.2rem;
      }

      button {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <main class="wrapper">
    <section class="hero" id="page-content"></section>
  </main>

  <script>
    let focusOn = false;
    let brownNoise = null;

    const pages = {
      home: `
        <h1>ברוכים הבאים</h1>

        <p class="subtitle">
          האתר נבנה כדי לעזור להבין סטטיסטיקה בצורה פשוטה, רגועה ובהירה —
          מהשפה הבסיסית ועד להבנה עמוקה של המושגים.
        </p>

        <div class="guide">
          <h2 style="text-align:center;">איך ללמוד כאן?</h2>

          <p>
            מומלץ להתחיל בהבנה כללית של למה בכלל צריך סטטיסטיקה תיאורית,
            אחר כך לעבור לסימנים, לאותיות ולמשמעויות שלהם,
            ורק בהמשך להגיע לנוסחאות, חישובים ותרגילים.
          </p>

          <p>
            המטרה היא לא רק לפתור שאלות, אלא להבין באמת מה אומרים לך,
            מה כל סימן מייצג, ואיך השפה הסטטיסטית מתחברת למציאות.
          </p>

          <p>
            כדאי ללמוד לאט, צעד אחר צעד — כמו פיקסלים קטנים שמרכיבים תמונה שלמה.
            כשמבינים את הבסיס היטב, כל ההמשך נעשה הרבה יותר פשוט.
          </p>
        </div>

        <div class="actions">
          <button onclick="goToPage('intro')">למה צריך סטטיסטיקה תיאורית?</button>
          <button onclick="toggleFocusMode()">מצב ריכוז</button>
        </div>

        <p class="note">
          זהו עמוד הבית. בהמשך יתווספו נושאים נוספים.
        </p>
      `,

      intro: `
        <h1>למה צריך סטטיסטיקה תיאורית?</h1>

        <p class="subtitle">
          סטטיסטיקה תיאורית עוזרת לנו להבין נתונים בצורה מסודרת, פשוטה וברורה.
        </p>

        <div class="card">
          <p>
            בחיים אנחנו כל הזמן מוקפים במספרים:
            ציונים, מחירים, משכורות, זמני נסיעה, תוצאות של מבחנים ונתונים מעבודה.
          </p>

          <p>
            כשמסתכלים רק על רשימה ארוכה של מספרים, קשה להבין מה באמת קורה.
            סטטיסטיקה תיאורית עוזרת לנו לסכם את הנתונים ולראות את התמונה הכללית.
          </p>

          <p>
            במקום לטבוע בתוך הרבה מספרים, אנחנו לומדים לשאול:
            מה טיפוסי? מה חריג? מה גבוה? מה נמוך? ומה קורה בדרך כלל?
          </p>
        </div>

        <div class="card" style="margin-top:20px;">
          <h2 style="text-align:center;">דוגמאות פשוטות</h2>

          <p>
            📊 <strong>ציונים בכיתה</strong><br>
            במקום להסתכל על עשרות ציונים בנפרד, אפשר להבין מה הרמה הכללית של הכיתה.
          </p>

          <p>
            💰 <strong>משכורות</strong><br>
            אפשר לבדוק מה שכר רגיל, ומה נחשב חריג או יוצא דופן.
          </p>

          <p>
            🚗 <strong>זמני נסיעה</strong><br>
            אפשר להבין כמה זמן לוקח בדרך כלל להגיע לעבודה, ולא רק במקרה חד־פעמי.
          </p>
        </div>

        <div class="card" style="margin-top:20px;">
          <p>
            המטרה של סטטיסטיקה תיאורית היא לא רק לחשב,
            אלא להבין נתונים ולהפוך בלגן למשהו ברור.
          </p>

          <p>
            לכן לפני הכל נתחיל מהשפה עצמה:
            סימנים, אותיות ומשמעויות.
          </p>
        </div>

        <div class="actions">
          <button onclick="goToPage('symbols')">מעבר לסימנים</button>
          <button onclick="goToPage('home')">חזרה לעמוד הבית</button>
          <button onclick="toggleFocusMode()">מצב ריכוז</button>
        </div>
      `,

      symbols: `
        <h1>סימנים בסיסיים בסטטיסטיקה</h1>

        <p class="subtitle">
          לפני שניגשים לחישובים, חשוב להבין את השפה עצמה:
          מה מסמל כל סימן, ואיך קוראים אותו.
        </p>

        <div class="card">
          <div class="symbol">&alpha;</div>

          <h2 style="text-align:center;">אלפא</h2>

          <p>
            <strong>מה זה?</strong><br>
            אלפא הוא הסיכוי לטעות ולהגיד שיש אפקט למרות שאין.
          </p>

          <p>
            <strong>במילים פשוטות:</strong><br>
            אם אלפא קטן, אנחנו זהירים יותר ולא ממהרים להגיד שיש אפקט.
          </p>

          <p>
            <strong>משפט חשוב:</strong><br>
            אלפא קטן = אני זהירה ולא מתלהבת סתם.
          </p>
        </div>

        <div class="actions">
          <button onclick="goToPage('intro')">חזרה ללמה צריך סטטיסטיקה</button>
          <button onclick="goToPage('home')">חזרה לעמוד הבית</button>
          <button onclick="toggleFocusMode()">מצב ריכוז</button>
        </div>
      `
    };

    function goToPage(pageName) {
      const main = document.getElementById('page-content');

      main.style.opacity = '0';
      main.style.transform = 'scale(0.96)';

      setTimeout(() => {
        main.innerHTML = pages[pageName];
        main.style.opacity = '1';
        main.style.transform = 'scale(1)';
        window.scrollTo(0, 0);
      }, 400);
    }

    function toggleFocusMode() {
      focusOn = !focusOn;
      document.body.classList.toggle('focus-mode', focusOn);

      if (!brownNoise) {
        brownNoise = new Audio('https://www.soundjay.com/misc/sounds/brown-noise-01.mp3');
        brownNoise.loop = true;
        brownNoise.volume = 0.35;
      }

      if (focusOn) {
        brownNoise.play().catch(() => {});
      } else {
        brownNoise.pause();
      }
    }

    document.getElementById('page-content').innerHTML = pages.home;
  </script>
</body>
</html>
