<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>דרך לימוד</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #e8e8e8;
      color: #111;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .container {
      text-align: center;
    }

    .title-btn {
      font-size: 36px;
      margin-bottom: 30px;
      text-decoration: none;
      color: #111;
      font-weight: bold;
      cursor: pointer;
    }

    .title-btn span {
      font-size: 20px;
      opacity: 0.5;
      margin-right: 8px;
      position: relative;
      top: -5px;
    }

    .btn {
      display: inline-block;
      padding: 16px 36px;
      margin: 10px;
      border-radius: 30px;
      text-decoration: none;
      font-size: 18px;
      background: #111;
      color: white;
    }

    /* מצב ריכוז */
    body.focus-mode {
      background: #111;
      color: #e8e8e8;
    }

    body.focus-mode .btn {
      background: #e8e8e8;
      color: #111;
    }

    body.focus-mode .title-btn {
      color: #e8e8e8;
    }
  </style>
</head>

<body>

<div class="container">

  <div id="focusBtn" class="title-btn">
    כשמבינים רואים <span>道</span>
  </div>

  <audio id="brownNoise" src="brown-noise.mp3" loop></audio>

  <a class="btn" href="statistika.html">סטטיסטיקה</a>
  <a class="btn" href="ccna.html">CCNA</a>

</div>

<script>
  const focusBtn = document.getElementById("focusBtn");
  const brownNoise = document.getElementById("brownNoise");

  focusBtn.addEventListener("click", function () {
    document.body.classList.toggle("focus-mode");

    if (brownNoise.paused) {
      brownNoise.play();
      localStorage.setItem("soundOn", "true");
    } else {
      brownNoise.pause();
      localStorage.setItem("soundOn", "false");
    }
  });
</script>

</body>
</html>
