<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>

 <!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-FTM28BMBXC"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}

  gtag('config', 'G-FTM28BMBXC');

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WayToSee | כשמבינים — רואים</title>
  <meta name="description" content="WayToSee הוא אתר לימוד בעברית: רשתות תקשורת (CCNA), סטטיסטיקה, פילוסופיה, אסטרופיזיקה, פסיכולוגיה ובינה מלאכותית. כל נושא מתחיל מהצורך, ורק אחר כך מהשם.">

  <link rel="stylesheet" href="waytosee.css">
  <!-- גופנים לכותרת של עמוד הבית בלבד -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@200&family=Assistant:wght@200&display=swap">

 <style>
    body {
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100svh;
      text-align: center;
      padding: 40px 20px;
      padding-top: calc(25vh * 7 / 16); /* לא בשימוש בפועל: גם בטלפון וגם במחשב יש כללים בהמשך שגוברים עליו */
      box-sizing: border-box;
    }

    .container {
      text-align: center;
      max-width: 760px;
      width: 100%;
      position: relative;
      z-index: 5;
    }

    .brand {
      margin-bottom: 42px;
      cursor: pointer;
      user-select: none;
      transition: 0.4s ease;
    }

    /* כותרת מינימליסטית: שורה אחת באנגלית, ומתחתיה המוטו, קטן ושקט יותר */
    /* עוצמת הכותרת במצב בהיר: הוכהתה ב-12%, ואז עוד 9%, ואז עוד 8%. במצב הכהה ללא שינוי.
       האנגלית כבר הגיעה לשקיפות מלאה, אז את ה-9% שלה נותן גוון כהה יותר של אותו כחול. */
    .brand { --en-op: 1; --he-op: 0.922; }
    body:not(.learning-mode) .brand-en { color: rgb(18,29,52); }
    body.learning-mode .brand { --en-op: 0.88; --he-op: 0.7; }

    /* מצב בהיר: הכיתוב גדול וכהה יותר. במצב הכהה ללא שינוי. */
    .brand-en, .brand-he { transition: font-size 0.4s ease, color 0.4s ease; }
    body:not(.learning-mode) .brand { --he-op: 1; }
    body:not(.learning-mode) .brand-en { font-size: 26px; color: rgb(12,20,38); }
    body:not(.learning-mode) .brand-he { font-size: 16.5px; color: rgb(12,20,38); }

    .brand-en {
      direction: ltr;
      white-space: nowrap;
      font-family: 'Jost', sans-serif;
      font-weight: 200;
      font-size: 22px;
      line-height: 1;
      letter-spacing: 0.7em;
      margin-right: -0.7em; /* מקזז את הרווח אחרי האות האחרונה, כדי שהשורה תהיה ממורכזת */
      color: var(--text);
      opacity: var(--en-op);
      animation: softReveal 0.4s ease-out forwards;
    }

    .brand-he {
      margin-top: 20px;
      font-family: 'Assistant', sans-serif;
      font-weight: 200;
      font-size: 14px;
      line-height: 1;
      letter-spacing: 0.35em;
      margin-left: -0.35em;
      color: var(--text);
      opacity: var(--he-op);
      animation: softRevealQuiet 0.6s ease-out forwards;
    }

    @keyframes softReveal {
      from { opacity: 0; filter: blur(5px); transform: translateY(8px); }
      to   { opacity: var(--en-op); filter: blur(0); transform: translateY(0); }
    }

    @keyframes softRevealQuiet {
      from { opacity: 0; filter: blur(5px); transform: translateY(8px); }
      to   { opacity: var(--he-op); filter: blur(0); transform: translateY(0); }
    }

    .btn {
      display: inline-block;
      min-width: 150px;
      padding: 16px 38px;
      margin: 12px;
      border-radius: 999px;
      text-decoration: none;
      font-size: 19px;
      font-weight: bold;
      background: linear-gradient(135deg, #111, #333);
      color: white;
      box-shadow: 0 8px 22px rgba(0,0,0,0.25);
      transition: 0.25s ease;
    }

    .btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 12px 28px rgba(0,0,0,0.35);
      background: linear-gradient(135deg, #000, #444);
    }

    .btn:active { transform: translateY(0); }

    .btn.disabled { cursor: default; opacity: 0.62; }

    .btn.disabled:hover {
      transform: none;
      box-shadow: 0 8px 22px rgba(0,0,0,0.25);
      background: linear-gradient(135deg, #111, #333);
    }

    body.learning-mode .btn {
      background: linear-gradient(135deg, #e8e8e8, #ffffff);
      color: #111;
      box-shadow: 0 8px 24px rgba(255,255,255,0.12);
    }

    body.learning-mode .btn:hover {
      background: linear-gradient(135deg, #ffffff, #dcdcdc);
    }

    body.learning-mode .btn.disabled:hover {
      transform: none;
      box-shadow: 0 8px 24px rgba(255,255,255,0.12);
      background: linear-gradient(135deg, #e8e8e8, #ffffff);
    }

    .philosophy {
      margin-top: 70px;
      line-height: 2.2;
      color: rgba(6,7,8,0.85);
      opacity: 0.82;
      transition: 0.4s ease;
    }

    body.learning-mode .philosophy { color: #dcdcdc; opacity: 0.9; }

    .philosophy-title { font-size: 24px; margin-bottom: 28px; letter-spacing: 1px; }
    .philosophy-line { font-size: 18px; margin: 10px 0; }

    .thinking-stations {
      margin-top: 46px;
      padding-top: 28px;
      border-top: 1px solid rgba(82,68,54,0.18);
      line-height: 2.1;
      opacity: 0.86;
    }

    body.learning-mode .thinking-stations {
      border-top: 1px solid rgba(255,255,255,0.16);
    }

    .thinking-line { font-size: 18px; margin: 8px 0; }
    .thinking-note { font-size: 17px; margin-top: 8px; opacity: 0.82; }

    #constructionSign {
      width: min(140px, 27.5vw, 9vh);
      height: auto;
      display: block;
      margin: 0 auto;
      opacity: 0.96;
    }

    .minimal-construction {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 14px;
      text-align: center;
      font-size: 10px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      opacity: 0.35;
      color: var(--text-dim);
      transition: color 0.8s ease, opacity 0.5s ease;
      pointer-events: none;
    }

    .rain {
      position: fixed;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      overflow: hidden;
    }

    .drop {
      position: absolute;
      top: -120px;
      width: 0.25px;
      height: 120px;
      background: linear-gradient(to bottom, rgba(255,255,255,0), rgba(70,90,120,0.07), rgba(255,255,255,0));
      animation: rain linear infinite;
    }

    body.learning-mode .drop {
      background: linear-gradient(to bottom, rgba(255,255,255,0), rgba(130,170,255,0.37), rgba(255,255,255,0));
    }

    @keyframes rain {
      from { transform: translateY(-120px); }
      to { transform: translateY(120vh); }
    }

    @media (max-width: 600px), (max-height: 850px) {
      /* הכיתוב הועלה ב-75%: במקום מרכוז מלא (מרווח עליון = חצי מהשטח הפנוי)
         המרווח העליון הוא שמינית מהשטח הפנוי (יחס 1:7 בין מעל למתחת) */
      body { flex-direction: column; align-items: center; justify-content: flex-start; padding: 14px 12px; }
      body::before { content: ""; flex: 1; }
      body::after { content: ""; flex: 7; }
      .brand { margin-bottom: 14px; }
      .brand-en { font-size: 16px; letter-spacing: 0.5em; margin-right: -0.5em; }
      .brand-he { margin-top: 14px; font-size: 12px; letter-spacing: 0.28em; margin-left: -0.28em; }
      body:not(.learning-mode) .brand-en { font-size: 19px; }
      body:not(.learning-mode) .brand-he { font-size: 14px; }
      .btn {
        display: block;
        width: 180px;
        margin: 10px auto;
        padding: 10px 26px;
        font-size: 16px;
      }
      .philosophy { margin-top: 20px; line-height: 1.65; }
      .philosophy-title { margin-bottom: 10px; font-size: 20px; }
      .philosophy-line { margin: 3px 0; font-size: 15px; }
      .thinking-stations { margin-top: 16px; padding-top: 12px; line-height: 1.55; }
      .thinking-line { margin: 3px 0; font-size: 15px; }
      .thinking-note { margin-top: 3px; font-size: 14px; }
      .construction-wrapper { margin-top: 12px; }
      #constructionSign { width: min(400px, 80vw, 25vh); }
      .minimal-construction { bottom: 8px; font-size: 9px; }
    }

    /* מחשב (כל גובה מסך, לא טלפון): הכיתוב מעל האמצע -
       16/75 מהשטח הפנוי מעליו (שליש, ואז הועלה פעמיים ב-0.2 מהמרחק לקצה העליון), יחס 16:59 */
    @media (min-width: 601px) and (min-height: 501px) {
      body { flex-direction: column; align-items: center; justify-content: flex-start; padding: 14px 12px; }
      body::before { content: ""; flex: 16; }
      body::after { content: ""; flex: 59; }
    }

    a.brand {
      display: block;
      color: inherit;
      text-decoration: none;
      -webkit-tap-highlight-color: transparent;
    }
  </style>
<script src="waytosee-scale.js"></script>
</head>

<body>

<div class="rain" id="rain"></div>

<div class="container">

  <a id="focusBtn" class="brand" href="professions.html">
    <div class="brand-en">Way To See</div>
    <div class="brand-he">כשמבינים — רואים</div>
  </a>

  <audio id="brownNoise" src="brown-noise.mp3" loop></audio>

  <!--
  קטע הפילוסופיה - מוסתר בכוונה, לא נמחק. להחזרה: להוציא מההערה הזו.

  <div class="philosophy">

    <div class="philosophy-title">אמנות לימוד</div>
    <div class="philosophy-line">לא לשנן מידע</div>
    <div class="philosophy-line">ללמוד לראות מערכות</div>
    <div class="philosophy-line">להבין איך דברים מתחברים</div>

    <div class="thinking-stations">

      <div class="thinking-line">באתר זה יונגשו תחנות חשיבה</div>
      <div class="thinking-note">(התקדמות תוך עצירה)</div>

      <div class="construction-wrapper">
        <img src="under-construction.png" id="constructionSign" alt="Under Construction">
      </div>

    </div>

  </div>
  -->

</div>

<script>
  const focusBtn = document.getElementById("focusBtn");
  const brownNoise = document.getElementById("brownNoise");

  // גשם עדין ברקע - אותו אפקט שבעמוד "מבוא לסטטיסטיקה"
  const rain = document.getElementById("rain");
  for (let i = 0; i < 90; i++) {
    const drop = document.createElement("div");
    drop.classList.add("drop");
    drop.style.left = Math.random() * 100 + "vw";
    drop.style.animationDuration = (4 + Math.random() * 7) + "s";
    drop.style.opacity = 0.12 + Math.random() * 0.25;
    rain.appendChild(drop);
  }

  function applyLearningMode(isOn) {
    document.body.classList.toggle("learning-mode", isOn);
    if (isOn) {
      brownNoise.volume = 0.25;
      brownNoise.play().catch(() => {});
    } else {
      brownNoise.pause();
      brownNoise.currentTime = 0;
    }
  }

  // עמוד הבית תמיד מתחיל במצב בהיר - גם ברענון וגם בחזרה אליו מעמוד אחר,
  // בלי קשר למצב האחרון שנשמר. (בשאר העמודים באתר המצב עדיין נשמר כרגיל.)

  // לחיצה ראשונה על הלוגו: הופכת צבעים (בהיר/כהה), כמו קודם.
  // לחיצה נוספת על הלוגו (בלי לרענן ביניהן): מעבירה לעמוד תחומי דעת.
  let logoArmed = false;
  focusBtn.addEventListener("click", (event) => {
    event.preventDefault();
    if (!logoArmed) {
      logoArmed = true;
      const isLearningMode = !document.body.classList.contains("learning-mode");
      applyLearningMode(isLearningMode);
      localStorage.setItem("waytoseeLearningMode", isLearningMode ? "on" : "off");
      // מעקב: כמה אנשים בכלל מגלים שהלוגו לוחץ (לחיצה ראשונה - הפיכת צבעים)
      if (typeof gtag === "function") {
        gtag("event", "homepage_logo_reveal", { event_category: "engagement" });
      }
    } else {
      // מעקב: כמה מתוכם ממשיכים בפועל לעמוד תחומי דעת (לחיצה שנייה)
      if (typeof gtag === "function") {
        gtag("event", "homepage_continue_to_topics", { event_category: "engagement" });
      }
      // עמוד התחומים תמיד מתחיל במצב בהיר. משם המשתמש בוחר בעצמו (כפתור מפתח הפה).
      localStorage.setItem("waytoseeLearningMode", "off");
      window.location.href = "professions.html";
    }
  });
</script>

</body>
</html>
