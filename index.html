<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>way to see</title>

  <link rel="stylesheet" href="waytosee.css">

 <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100svh;
      text-align: center;
      padding: 40px 20px;
      box-sizing: border-box;
    }

    .container {
      text-align: center;
      max-width: 760px;
      width: 100%;
      position: relative;
      z-index: 5;
    }

    .brand {
      margin-bottom: 42px;
      cursor: pointer;
      user-select: none;
      transition: 0.4s ease;
    }

    .brand-en {
      direction: ltr;
      font-size: 34px;
      letter-spacing: 0.36em;
      text-transform: uppercase;
      font-weight: 300;
      color: rgba(82,68,54,0.96);
      opacity: 0.88;
      animation: softReveal 1.8s ease-out forwards;
    }

    body.learning-mode .brand-en {
      color: rgba(240,240,240,0.92);
    }

    .brand-he {
      margin-top: 18px;
      font-size: 24px;
      letter-spacing: 0.04em;
      color: rgba(82,68,54,0.96);
      opacity: 0.86;
      animation: softReveal 2.2s ease-out forwards;
    }

    body.learning-mode .brand-he {
      color: rgba(240,240,240,0.92);
    }

    .dao-wrap {
      position: relative;
      display: inline-block;
      margin-top: 18px;
    }

    .dao-mark {
      display: block;
      font-family: 'Yuji Mai', cursive;
      font-size: 58px;
      line-height: 1;
      opacity: 0.82;
      color: rgba(82,68,54,0.96);
      animation: inkAppear 2.4s ease-out forwards;
    }

    body.learning-mode .dao-mark {
      color: rgba(240,240,240,0.92);
    }

    @keyframes softReveal {
      from { opacity: 0; filter: blur(5px); transform: translateY(8px); }
      to   { opacity: 0.88; filter: blur(0); transform: translateY(0); }
    }

    @keyframes inkAppear {
      from { opacity: 0; filter: blur(6px); transform: translateY(10px) scale(0.94); }
      to   { opacity: 0.82; filter: blur(0); transform: translateY(0) scale(1); }
    }

    .btn {
      display: inline-block;
      min-width: 150px;
      padding: 16px 38px;
      margin: 12px;
      border-radius: 999px;
      text-decoration: none;
      font-size: 19px;
      font-weight: bold;
      background: linear-gradient(135deg, #111, #333);
      color: white;
      box-shadow: 0 8px 22px rgba(0,0,0,0.25);
      transition: 0.25s ease;
    }

    .btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 12px 28px rgba(0,0,0,0.35);
      background: linear-gradient(135deg, #000, #444);
    }

    .btn:active { transform: translateY(0); }

    .btn.disabled { cursor: default; opacity: 0.62; }

    .btn.disabled:hover {
      transform: none;
      box-shadow: 0 8px 22px rgba(0,0,0,0.25);
      background: linear-gradient(135deg, #111, #333);
    }

    body.learning-mode .btn {
      background: linear-gradient(135deg, #e8e8e8, #ffffff);
      color: #111;
      box-shadow: 0 8px 24px rgba(255,255,255,0.12);
    }

    body.learning-mode .btn:hover {
      background: linear-gradient(135deg, #ffffff, #dcdcdc);
    }

    body.learning-mode .btn.disabled:hover {
      transform: none;
      box-shadow: 0 8px 24px rgba(255,255,255,0.12);
      background: linear-gradient(135deg, #e8e8e8, #ffffff);
    }

    .philosophy {
      margin-top: 70px;
      line-height: 2.2;
      color: rgba(82,68,54,0.85);
      opacity: 0.82;
      transition: 0.4s ease;
    }

    body.learning-mode .philosophy { color: #dcdcdc; opacity: 0.9; }

    .philosophy-title { font-size: 24px; margin-bottom: 28px; letter-spacing: 1px; }
    .philosophy-line { font-size: 18px; margin: 10px 0; }

    .thinking-stations {
      margin-top: 46px;
      padding-top: 28px;
      border-top: 1px solid rgba(82,68,54,0.18);
      line-height: 2.1;
      opacity: 0.86;
    }

    body.learning-mode .thinking-stations {
      border-top: 1px solid rgba(255,255,255,0.16);
    }

    .thinking-line { font-size: 18px; margin: 8px 0; }
    .thinking-note { font-size: 17px; margin-top: 8px; opacity: 0.82; }

    #constructionSign {
      width: min(140px, 27.5vw, 9vh);
      height: auto;
      display: block;
      margin: 0 auto;
      opacity: 0.96;
    }

    @media (max-width: 600px), (max-height: 850px) {
      body { padding: 14px 12px; }
      .brand { margin-bottom: 14px; }
      .brand-en { font-size: clamp(19px, 5vw, 25px); letter-spacing: 0.24em; }
      .brand-he { margin-top: 8px; font-size: clamp(17px, 4.5vw, 21px); }
      .dao-mark { font-size: clamp(38px, 10vw, 50px); }
      .btn {
        display: block;
        width: 180px;
        margin: 10px auto;
        padding: 10px 26px;
        font-size: 16px;
      }
      .philosophy { margin-top: 20px; line-height: 1.65; }
      .philosophy-title { margin-bottom: 10px; font-size: 20px; }
      .philosophy-line { margin: 3px 0; font-size: 15px; }
      .thinking-stations { margin-top: 16px; padding-top: 12px; line-height: 1.55; }
      .thinking-line { margin: 3px 0; font-size: 15px; }
      .thinking-note { margin-top: 3px; font-size: 14px; }
      .construction-wrapper { margin-top: 12px; }
      #constructionSign { width: min(400px, 80vw, 25vh); }
    }
  </style>
</head>

<body>

<div class="container">

  <div id="focusBtn" class="brand">
    <div class="brand-en">way to see</div>
    <div class="brand-he">כשמבינים — רואים</div>
    <div class="dao-wrap">
      <span class="dao-mark">道</span>
      <span class="clef-inline"></span>
    </div>
  </div>

  <audio id="brownNoise" src="brown-noise.mp3" loop></audio>

  <a class="btn disabled" href="#" onclick="return false;">סטטיסטיקה</a>
  <a class="btn" href="intro.html">רשתותS</a>

  <div class="philosophy">

    <div class="philosophy-title">אמנות לימוד</div>
    <div class="philosophy-line">לא לשנן מידע</div>
    <div class="philosophy-line">ללמוד לראות מערכות</div>
    <div class="philosophy-line">להבין איך דברים מתחברים</div>

    <div class="thinking-stations">

      <div class="thinking-line">באתר זה יונגשו תחנות חשיבה</div>
      <div class="thinking-note">(התקדמות תוך עצירה)</div>

      <div class="construction-wrapper">
        <img src="under-construction.png" id="constructionSign" alt="Under Construction">
      </div>

    </div>

  </div>

</div>

<script>
  const focusBtn = document.getElementById("focusBtn");
  const brownNoise = document.getElementById("brownNoise");

  focusBtn.addEventListener("click", () => {
    document.body.classList.toggle("learning-mode");

    if (document.body.classList.contains("learning-mode")) {
      brownNoise.volume = 0.25;
      brownNoise.play().catch(() => {});
    } else {
      brownNoise.pause();
      brownNoise.currentTime = 0;
    }
  });
</script>

</body>
</html>
