<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>way to see</title>

  <link href="https://fonts.googleapis.com/css2?family=Yuji+Mai&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #e8e8e8;
      color: #111;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      text-align: center;
      transition: 0.4s ease;
      padding: 40px 20px;
      box-sizing: border-box;
      overflow-x: hidden;
    }

    .container {
      text-align: center;
      max-width: 760px;
      width: 100%;
      position: relative;
      z-index: 5;
    }

    .brand {
      margin-bottom: 42px;
      cursor: pointer;
      user-select: none;
      transition: 0.4s ease;
    }

    .brand-en {
      direction: ltr;
      font-size: 34px;
      letter-spacing: 0.36em;
      text-transform: uppercase;
      font-weight: 300;
      color: #111;
      opacity: 0.88;
      animation: softReveal 1.8s ease-out forwards;
    }

    .brand-he {
      margin-top: 18px;
      font-size: 24px;
      letter-spacing: 0.04em;
      color: #111;
      opacity: 0.86;
      animation: softReveal 2.2s ease-out forwards;
    }

    .dao-mark {
      display: block;
      font-family: 'Yuji Mai', cursive;
      font-size: 58px;
      line-height: 1;
      margin-top: 18px;
      opacity: 0.82;
      animation: inkAppear 2.4s ease-out forwards;
    }

    @keyframes softReveal {
      from {
        opacity: 0;
        filter: blur(5px);
        transform: translateY(8px);
      }
      to {
        opacity: 0.88;
        filter: blur(0);
        transform: translateY(0);
      }
    }

    @keyframes inkAppear {
      from {
        opacity: 0;
        filter: blur(6px);
        transform: translateY(10px) scale(0.94);
      }
      to {
        opacity: 0.82;
        filter: blur(0);
        transform: translateY(0) scale(1);
      }
    }

    .btn {
      display: inline-block;
      min-width: 150px;
      padding: 16px 38px;
      margin: 12px;
      border-radius: 999px;
      text-decoration: none;
      font-size: 19px;
      font-weight: bold;
      background: linear-gradient(135deg, #111, #333);
      color: white;
      box-shadow: 0 8px 22px rgba(0,0,0,0.25);
      transition: 0.25s ease;
    }

    .btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 12px 28px rgba(0,0,0,0.35);
      background: linear-gradient(135deg, #000, #444);
    }

    .btn:active {
      transform: translateY(0);
    }

    .btn.disabled {
      cursor: default;
      opacity: 0.62;
    }

    .btn.disabled:hover {
      transform: none;
      box-shadow: 0 8px 22px rgba(0,0,0,0.25);
      background: linear-gradient(135deg, #111, #333);
    }

    .philosophy {
      margin-top: 70px;
      line-height: 2.2;
      opacity: 0.82;
      transition: 0.4s ease;
    }

    .philosophy-title {
      font-size: 24px;
      margin-bottom: 28px;
      letter-spacing: 1px;
    }

    .philosophy-line {
      font-size: 18px;
      margin: 10px 0;
    }

    .thinking-stations {
      margin-top: 46px;
      padding-top: 28px;
      border-top: 1px solid rgba(0,0,0,0.14);
      line-height: 2.1;
      opacity: 0.86;
    }

    .thinking-line {
      font-size: 18px;
      margin: 8px 0;
    }

    .thinking-note {
      font-size: 17px;
      margin-top: 8px;
      opacity: 0.82;
    }

    body.focus-mode {
      background: #000;
      color: rgba(215,220,230,0.82);
    }

    body.focus-mode .brand-en,
    body.focus-mode .brand-he {
      color: #e8e8e8;
    }

    body.focus-mode .dao-mark {
      color: #e8e8e8;
      opacity: 0.9;
    }

    body.focus-mode .btn {
      background: linear-gradient(135deg, #e8e8e8, #ffffff);
      color: #111;
      box-shadow: 0 8px 24px rgba(255,255,255,0.12);
    }

    body.focus-mode .btn:hover {
      background: linear-gradient(135deg, #ffffff, #dcdcdc);
    }

    body.focus-mode .btn.disabled:hover {
      transform: none;
      box-shadow: 0 8px 24px rgba(255,255,255,0.12);
      background: linear-gradient(135deg, #e8e8e8, #ffffff);
    }

    body.focus-mode .philosophy {
      color: #dcdcdc;
      opacity: 0.9;
    }

    body.focus-mode .thinking-stations {
      border-top: 1px solid rgba(255,255,255,0.16);
    }

    .clef-layer {
      display: none;
    }

    body.focus-mode .clef-layer {
      display: block;
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 1;
      overflow: hidden;
    }

    .clef {
      position: absolute;
      top: 50%;
      width: 420px;
      transform: translateY(-50%);
      opacity: 0;
      filter: grayscale(100%);
    }

    .left-clef {
      left: 2%;
    }

    .right-clef {
      right: 2%;
      transform: translateY(-50%) scaleX(-1);
    }

    body.focus-mode .clef-layer::after {
      content: "";
      position: absolute;
      width: 75vw;
      height: 75vh;
      left: -80vw;
      top: -70vh;
      background: radial-gradient(
        ellipse,
        rgba(255,255,255,0.18) 0%,
        rgba(255,255,255,0.08) 28%,
        rgba(255,255,255,0.025) 48%,
        transparent 70%
      );
      filter: blur(28px);
      transform: rotate(-22deg);
      animation: diagonalWave 13s ease-in-out 5s infinite;
    }

    body.focus-mode .clef {
      animation: revealClef 13s ease-in-out 5s infinite;
    }

    @keyframes diagonalWave {
      0% {
        left: -80vw;
        top: -70vh;
        opacity: 0;
      }
      12% {
        opacity: 0;
      }
      25% {
        opacity: 1;
      }
      55% {
        left: 85vw;
        top: 75vh;
        opacity: 1;
      }
      70% {
        opacity: 0;
      }
      100% {
        left: 85vw;
        top: 75vh;
        opacity: 0;
      }
    }

    @keyframes revealClef {
      0% {
        opacity: 0;
      }
      18% {
        opacity: 0;
      }
      32% {
        opacity: 0.09;
      }
      52% {
        opacity: 0.09;
      }
      68% {
        opacity: 0;
      }
      100% {
        opacity: 0;
      }
    }

    @media (max-width: 600px) {
      body {
        padding: 30px 16px;
      }

      .brand-en {
        font-size: 24px;
        letter-spacing: 0.24em;
      }

      .brand-he {
        font-size: 21px;
      }

      .dao-mark {
        font-size: 52px;
      }

      .btn {
        display: block;
        width: 180px;
        margin: 14px auto;
      }

      .philosophy {
        margin-top: 55px;
      }

      .philosophy-title {
        font-size: 22px;
      }

      .philosophy-line {
        font-size: 17px;
      }

      .thinking-stations {
        margin-top: 40px;
      }

      .thinking-line {
        font-size: 17px;
      }

      .thinking-note {
        font-size: 16px;
      }

      .clef {
        width: 260px;
      }

      .left-clef {
        left: -22%;
      }

      .right-clef {
        right: -22%;
      }
    }
  </style>
</head>

<body>

<div class="clef-layer">
  <img src="waytosee-clef.png" class="clef left-clef" alt="">
  <img src="waytosee-clef.png" class="clef right-clef" alt="">
</div>

<div class="container">

  <div id="focusBtn" class="brand">
    <div class="brand-en">way to see</div>
    <div class="brand-he">כשמבינים — רואים</div>
    <span class="dao-mark">道</span>
  </div>

  <audio id="brownNoise" src="brown-noise.mp3" loop></audio>

  <a class="btn disabled" href="#" onclick="return false;">סטטיסטיקה</a>
  <a class="btn" href="intro.html">CCNA</a>

  <div class="philosophy">

    <div class="philosophy-title">
      אמנות לימוד
    </div>

    <div class="philosophy-line">
      לא לשנן מידע
    </div>

    <div class="philosophy-line">
      ללמוד לראות מערכות
    </div>

    <div class="philosophy-line">
      להבין איך דברים מתחברים
    </div>

    <div class="thinking-stations">

      <div class="thinking-line">
        באתר זה יונגשו תחנות חשיבה
      </div>

      <div class="thinking-note">
        (התקדמות תוך עצירה)
      </div>

    </div>

  </div>

</div>

<script>
  const focusBtn = document.getElementById("focusBtn");
  const brownNoise = document.getElementById("brownNoise");

  focusBtn.addEventListener("click", () => {
    document.body.classList.toggle("focus-mode");

    if (document.body.classList.contains("focus-mode")) {
      brownNoise.volume = 0.25;
      brownNoise.play().catch(() => {});
    } else {
      brownNoise.pause();
      brownNoise.currentTime = 0;
    }
  });
</script>

</body>
</html>
