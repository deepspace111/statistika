<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>דרך לימוד</title>

  <link href="https://fonts.googleapis.com/css2?family=Yuji+Mai&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #e8e8e8;
      color: #111;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      text-align: center;
      transition: 0.4s ease;
      padding: 40px 20px;
      box-sizing: border-box;
    }

    .container {
      text-align: center;
      max-width: 700px;
      width: 100%;
    }

    .title-btn {
      font-size: 36px;
      margin-bottom: 34px;
      color: #111;
      font-weight: bold;
      cursor: pointer;
      transition: 0.4s ease;
    }

    .title-btn span {
      font-family: 'Yuji Mai', cursive;
      font-size: 54px;
      opacity: 0.95;
      margin-right: 12px;
      position: relative;
      top: 8px;
      animation: inkAppear 2s ease-out forwards;
    }

    @keyframes inkAppear {
      from {
        opacity: 0;
        filter: blur(4px);
        transform: translateY(8px) scale(0.96);
      }
      to {
        opacity: 0.95;
        filter: blur(0);
        transform: translateY(0) scale(1);
      }
    }

    .btn {
      display: inline-block;
      min-width: 150px;
      padding: 16px 38px;
      margin: 12px;
      border-radius: 999px;
      text-decoration: none;
      font-size: 19px;
      font-weight: bold;
      background: linear-gradient(135deg, #111, #333);
      color: white;
      box-shadow: 0 8px 22px rgba(0,0,0,0.25);
      transition: 0.25s ease;
    }

    .btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 12px 28px rgba(0,0,0,0.35);
      background: linear-gradient(135deg, #000, #444);
    }

    .btn:active {
      transform: translateY(0);
    }

    .philosophy {
      margin-top: 70px;
      line-height: 2.2;
      opacity: 0.82;
      transition: 0.4s ease;
    }

    .philosophy-title {
      font-size: 24px;
      margin-bottom: 28px;
      letter-spacing: 1px;
    }

    .philosophy-line {
      font-size: 18px;
      margin: 10px 0;
    }

    .philosophy-final {
      font-size: 20px;
      margin-top: 24px;
      font-weight: bold;
    }

    .thinking-stations {
      margin-top: 46px;
      padding-top: 28px;
      border-top: 1px solid rgba(0,0,0,0.14);
      line-height: 2.1;
      opacity: 0.86;
    }

    .thinking-line {
      font-size: 18px;
      margin: 8px 0;
    }

    .thinking-note {
      font-size: 17px;
      margin-top: 8px;
      opacity: 0.82;
    }

    body.focus-mode {
      background: #111;
      color: #e8e8e8;
    }

    body.focus-mode .title-btn {
      color: #e8e8e8;
    }

    body.focus-mode .btn {
      background: linear-gradient(135deg, #e8e8e8, #ffffff);
      color: #111;
      box-shadow: 0 8px 24px rgba(255,255,255,0.12);
    }

    body.focus-mode .btn:hover {
      background: linear-gradient(135deg, #ffffff, #dcdcdc);
    }

    body.focus-mode .philosophy {
      color: #dcdcdc;
      opacity: 0.9;
    }

    body.focus-mode .thinking-stations {
      border-top: 1px solid rgba(255,255,255,0.16);
    }

    @media (max-width: 600px) {

      body {
        padding: 30px 16px;
      }

      .title-btn {
        font-size: 30px;
      }

      .title-btn span {
        font-size: 50px;
      }

      .btn {
        display: block;
        width: 180px;
        margin: 14px auto;
      }

      .philosophy {
        margin-top: 55px;
      }

      .philosophy-title {
        font-size: 22px;
      }

      .philosophy-line {
        font-size: 17px;
      }

      .philosophy-final {
        font-size: 19px;
      }

      .thinking-stations {
        margin-top: 40px;
      }

      .thinking-line {
        font-size: 17px;
      }

      .thinking-note {
        font-size: 16px;
      }
    }
  </style>
</head>

<body>

<div class="container">

  <div id="focusBtn" class="title-btn">
    כשמבינים רואים <span>道</span>
  </div>

  <audio id="brownNoise" src="brown-noise.mp3" loop></audio>

  <a class="btn" href="statistika.html">סטטיסטיקה</a>
  <a class="btn" href="intro.html">CCNA</a>

  <div class="philosophy">

    <div class="philosophy-title">
      אמנות לימוד
    </div>

    <div class="philosophy-line">
      לא לשנן מידע
    </div>

    <div class="philosophy-line">
      ללמוד לראות מערכות
    </div>

    <div class="philosophy-line">
      להבין איך דברים מתחברים
    </div>

    

    <div class="thinking-stations">

      <div class="thinking-line">
        באתר זה יונגשו תחנות חשיבה
      </div>

      <div class="thinking-note">
        (התקדמות תוך עצירה)
      </div>

    </div>

  </div>

</div>

<script>
  const focusBtn = document.getElementById("focusBtn");
  const brownNoise = document.getElementById("brownNoise");

  focusBtn.addEventListener("click", function () {
    document.body.classList.toggle("focus-mode");

    if (brownNoise.paused) {
      brownNoise.play();
      localStorage.setItem("soundOn", "true");
    } else {
      brownNoise.pause();
      localStorage.setItem("soundOn", "false");
    }
  });
</script>

</body>
</html>
