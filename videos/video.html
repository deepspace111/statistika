<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>דרך הרשת</title>

<style>

body{
  margin:0;
  background:#111;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
  overflow:hidden;
}

img{
  width:100%;
  height:100%;
  object-fit:contain;
}

</style>
</head>

<body>

<img id="slide" src="1.jpg">

<script>

const images = [
"1.jpg",
"2.jpg",
"3.jpg",
"4.jpg",
"5.jpg",
"6.jpg",
"7.jpg"
];

let index = 0;

setInterval(() => {

  index++;

  if(index >= images.length){
    index = 0;
  }

  document.getElementById("slide").src = images[index];

}, 2500);

</script>

</body>
</html>
