```html
<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>רואים את הדרך</title>

<link href="https://fonts.googleapis.com/css2?family=Yuji+Mai&display=swap" rel="stylesheet">

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #000;
  color: #f2f2f2;
  overflow: hidden;
}

/* כפתור בית */

#homeBtn {
  position: fixed;
  top: 14px;
  left: 14px;
  z-index: 30;
  text-decoration: none;
  font-family: 'Yuji Mai', serif;
  font-size: 24px;
  color: rgba(255,255,255,0.52);
  opacity: 0.8;
}

/* אזור התמונות */

.cinema {
  position: fixed;
  inset: 0;
  overflow: hidden;
  background: #000;
}

.slide-layer {
  position: absolute;
  inset: 0;

  width: 100%;
  height: 100%;

  object-fit: cover;

  opacity: 0;
  transform: scale(1.035);

  transition:
    opacity 1.15s ease,
    transform 4.2s ease;
}

.slide-layer.visible {
  opacity: 1;
  transform: scale(1);
}

/* שכבת אווירה עדינה */

.cinema::after {
  content: "";
  position: absolute;
  inset: 0;
  z-index: 5;
  pointer-events: none;
  background:
    radial-gradient(circle at center, rgba(0,0,0,0.05), rgba(0,0,0,0.48)),
    linear-gradient(to bottom, rgba(0,0,0,0.10), rgba(0,0,0,0.40));
}

/* טקסט עליון */

.caption {
  position: fixed;
  right: 50%;
  bottom: 46px;
  transform: translateX(50%);
  z-index: 20;

  width: min(90vw, 760px);
  text-align: center;

  font-size: 22px;
  line-height: 1.8;
  letter-spacing: 0.02em;

  color: rgba(245,245,245,0.88);
  text-shadow: 0 0 18px rgba(0,0,0,0.85);
}

.caption .small {
  display: block;
  margin-top: 10px;
  font-size: 15px;
  opacity: 0.58;
}

/* כפתור המשך */

.nextBtn {
  position: fixed;
  bottom: 18px;
  right: 18px;
  z-index: 30;

  color: rgba(255,255,255,0.62);
  text-decoration: none;
  font-size: 15px;

  border: 1px solid rgba(255,255,255,0.18);
  border-radius: 20px;
  padding: 7px 18px;

  background: rgba(0,0,0,0.22);
}

.nextBtn:hover {
  color: rgba(255,255,255,0.9);
  border-color: rgba(255,255,255,0.38);
}

/* מובייל */

@media (max-width: 700px) {
  .caption {
    bottom: 58px;
    font-size: 18px;
    line-height: 1.7;
  }

  #homeBtn {
    font-size: 22px;
  }

  .nextBtn {
    font-size: 14px;
    padding: 6px 15px;
  }
}

</style>
</head>

<body>

<a href="../ccna-introduction.html" id="homeBtn">道</a>

<div class="cinema">
  <img id="slideA" class="slide-layer visible" src="1.jpg.png" alt="">
  <img id="slideB" class="slide-layer" src="2.jpg.png" alt="">
</div>

<div class="caption">
  המידע מתפרק, נעטף, נע — ונבנה מחדש.
  <span class="small">כשמבינים — רואים.</span>
</div>

<a href="../ccna.html" class="nextBtn">המשך</a>

<script>

const images = [
  "1.jpg.png",
  "2.jpg.png",
  "3.jpg.png",
  "4.jpg.png",
  "5.jpg.png",
  "6.jpg.png",
  "7.jpg.png",
  "8.jpg.png",
  "9.jpg.png",
  "10.jpg.png",
  "11.jpg.png",
  "12.jpg.png",
  "13.jpg.png"
];

images.forEach(src => {
  const img = new Image();
  img.src = src;
});

let index = 0;
let showingA = true;

const slideA = document.getElementById("slideA");
const slideB = document.getElementById("slideB");

setInterval(() => {
  index = (index + 1) % images.length;

  const current = showingA ? slideA : slideB;
  const next = showingA ? slideB : slideA;

  next.src = images[index];

  next.classList.add("visible");
  current.classList.remove("visible");

  showingA = !showingA;

}, 2100);

</script>

</body>
</html>
