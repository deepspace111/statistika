<!DOCTYPE html>
<html lang="he" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>דרך הרשת</title>

<link href="https://fonts.googleapis.com/css2?family=Yuji+Mai&display=swap" rel="stylesheet">

<style>

body{
  margin:0;
  background:#111;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
  overflow:hidden;
}

/* דו */

#homeBtn {

  position: fixed;

  top: 14px;
  left: 14px;

  text-decoration: none;

  font-family: 'Yuji Mai', serif;

  font-size: 23px;

  color: rgba(220,220,220,0.40);

  z-index: 100;

  opacity: 0;

  animation: fadeInHome 3s ease forwards;
}

@keyframes fadeInHome {

  from {
    opacity: 0;
    transform: translateY(8px);
  }

  to {
    opacity: 0.72;
    transform: translateY(0);
  }
}

/* תמונות */

img{
  width:100%;
  height:100%;
  object-fit:contain;

  opacity:1;

  transition:opacity 1s ease;
}

</style>

</head>

<body>

<a href="../index.html" id="homeBtn">道</a>

<img id="slide" src="1.jpg.png">

<script>

const images = [

"1.jpg.png",
"2.jpg.png",
"3.jpg.png",
"4.jpg.png",
"5.jpg.png",
"6.jpg.png",
"7.jpg.png",
"8.jpg.png",
"9.jpg.png",
"10.jpg.png",
"11.jpg.png",
"12.jpg.png",
"13.jpg.png"

];

let index = 0;

const slide = document.getElementById("slide");

setInterval(() => {

  slide.style.opacity = 0;

  setTimeout(() => {

    index++;

    if(index >= images.length){
      index = 0;
    }

    slide.src = images[index];

    slide.style.opacity = 1;

  }, 1000);

}, 2500);

</script>

</body>
</html>
