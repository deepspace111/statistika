<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>השכבה הפיזית</title>

<link href="https://fonts.googleapis.com/css2?family=Yuji+Mai&display=swap" rel="stylesheet">

<style>
*{ box-sizing:border-box; }

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#cec8be;
  color:rgba(78,68,58,0.88);
  text-align:center;
  line-height:3.05;
  overflow-x:hidden;
  transition:background 1.6s ease,color 1.6s ease;
  font-size:11px;
  letter-spacing:0.22em;
  font-weight:300;
  -webkit-font-smoothing:antialiased;
}

body.learning-mode{
  background:#05070b;
  color:rgba(220,220,220,0.74);
}

.rain{
  position:fixed;
  inset:0;
  z-index:2;
  pointer-events:none;
  overflow:hidden;
  opacity:0;
  transition:opacity 1.4s ease;
}

body.storm-active .rain{ opacity:0.42; }

.drop{
  position:absolute;
  top:-120vh;
  width:1px;
  height:78px;
  background:linear-gradient(
    to bottom,
    rgba(110,170,255,0),
    rgba(110,170,255,0.38),
    rgba(110,170,255,0)
  );
  animation:rain linear infinite;
}

@keyframes rain{
  from{ transform:translateY(-20vh); }
  to{ transform:translateY(150vh); }
}

.thunder-cloud{
  position:fixed;
  top:18vh;
  left:9vw;
  width:38vw;
  height:28vh;
  background:radial-gradient(
    circle,
    rgba(120,170,255,0.10),
    rgba(80,120,180,0.05),
    rgba(0,0,0,0)
  );
  z-index:3;
  pointer-events:none;
  opacity:0;
  filter:blur(22px);
  transition:opacity 0.8s ease;
}

.thunder-cloud.flash{ opacity:1; }
