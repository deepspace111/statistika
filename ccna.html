<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<title>CCNA - התחלה</title>

<style>
body {
  margin: 0;
  font-family: Arial;
  background: #111;
  color: #f2f2f2;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  text-align: center;
}

/* כפתור דו */
#homeBtn {
  position: fixed;
  top: 20px;
  left: 20px;
  width: 42px;
  height: 42px;
  z-index: 1000;
  opacity: 0.9;
  transition: 0.3s;
}

#homeBtn:hover {
  opacity: 1;
}

#homeBtn img {
  width: 100%;
  height: 100%;
  object-fit: contain;
}

/* מובייל */
@media (max-width: 600px) {
  #homeBtn {
    width: 50px;
    height: 50px;
    top: 15px;
    left: 15px;
  }
}

/* כפתור תודעת למידה */
.focus-btn {
  position: fixed;
  bottom: 20px;
  right: 20px;
  z-index: 9999;
  background: #222;
  color: white;
  padding: 14px 18px;
  border-radius: 18px;
  font-size: 16px;
  cursor: pointer;
  box-shadow: 0 4px 20px rgba(0,0,0,.4);
}

/* מצב פוקוס */
body.focus-mode {
  background: #000 !important;
  color: #ddd !important;
}
</style>
</head>

<body>

<h1>CCNA - התחלה</h1>

<a href="index.html" id="homeBtn">
  <img src="do-zen.png" alt="דרך">
</a>

<div class="focus-btn" onclick="toggleFocus()">תודעת למידה</div>

<audio id="brownNoise" src="brown-noise.mp3" loop></audio>

<script>
function toggleFocus() {
  document.body.classList.toggle("focus-mode");

  const audio = document.getElementById("brownNoise");

  if (document.body.classList.contains("focus-mode")) {
    audio.play();
  } else {
    audio.pause();
  }
}
</script>

</body>
</html>
