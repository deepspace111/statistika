<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CCNA - התחלה</title>

<link href="https://fonts.googleapis.com/css2?family=Yuji+Mai&display=swap" rel="stylesheet">

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  height: 100vh;
  overflow: hidden;
  display: flex;
  justify-content: center;
  align-items: center;
  text-align: center;
  background: #e8e8e8;
  color: #111;
  transition: background 1.2s ease, color 1.2s ease;
}

/* מצב אחרי לחיצה ראשונה */
body.awake {
  background: #050505;
  color: #e8e8e8;
}

/* גשם בינארי */
#matrixRain {
  position: fixed;
  inset: 0;
  width: 100vw;
  height: 100vh;
  z-index: 0;
  opacity: 0;
  transition: opacity 1.4s ease;
}

body.awake #matrixRain {
  opacity: 0.22;
}

/* הבהוב מסך */
.screenFlicker {
  position: fixed;
  inset: 0;
  z-index: 1;
  pointer-events: none;
  opacity: 0;
  background:
    linear-gradient(
      rgba(255,255,255,0.028) 50%,
      rgba(0,0,0,0.028) 50%
    );
  background-size: 100% 4px;
  animation: screenBlink 3.8s infinite;
  transition: opacity 1.4s ease;
}

body.awake .screenFlicker {
  opacity: 1;
}

@keyframes screenBlink {
  0%, 100% { opacity: 0.10; }
  40% { opacity: 0.16; }
  42% { opacity: 0.03; }
  44% { opacity: 0.22; }
  46% { opacity: 0.06; }
  70% { opacity: 0.13; }
}

/* דו */
#homeBtn {
  position: fixed;
  top: 12px;
  left: 14px;
  font-family: 'Yuji Mai', cursive;
  font-size: 34px;
  color: rgba(20,20,20,0.55);
  text-decoration: none;
  line-height: 1;
  z-index: 10;
  opacity: 0;
  animation: inkAppear 2.5s ease-out forwards;
  transition: color 1.2s ease;
}

body.awake #homeBtn {
  color: rgba(232,232,232,0.55);
}

@keyframes inkAppear {
  from {
    opacity: 0;
    filter: blur(4px);
    transform: translateY(8px) scale(0.96);
  }
  to {
    opacity: 0.85;
    filter: blur(0);
    transform: translateY(0) scale(1);
  }
}

.center {
  position: relative;
  z-index: 5;
  padding: 20px;
}

/* הכותרת */
#startBtn {
  border: 0;
  background: transparent;
  cursor: pointer;
  font-size: 38px;
  color: #111;
  font-weight: bold;
  letter-spacing: 0.5px;
  font-family: Arial, sans-serif;
  transition: color 1.2s ease, text-shadow 1.2s ease, opacity 0.3s ease;
  animation: titleAppear 2.8s ease forwards;
}

#startBtn:hover {
  opacity: 0.75;
}

body.awake #startBtn {
  color: #f2f2f2;
  text-shadow:
    0 0 12px rgba(141,252,255,0.24),
    0 0 30px rgba(141,252,255,0.12);
  animation:
    titleAppear 2.8s ease forwards,
    titleBlink 3.6s infinite;
}

@keyframes titleAppear {
  from {
    opacity: 0;
    filter: blur(5px);
    transform: translateY(10px);
  }
  to {
    opacity: 1;
    filter: blur(0);
    transform: translateY(0);
  }
}

/* הבהוב עדין לכותרת */
@keyframes titleBlink {
  0%, 100% {
    opacity: 0.95;
    text-shadow:
      0 0 10px rgba(141,252,255,0.18),
      0 0 24px rgba(141,252,255,0.08);
  }

  45% {
    opacity: 0.42;
    text-shadow:
      0 0 4px rgba(141,252,255,0.08),
      0 0 10px rgba(141,252,255,0.04);
  }

  47% {
    opacity: 1;
    text-shadow:
      0 0 18px rgba(141,252,255,0.34),
      0 0 42px rgba(141,252,255,0.18);
  }

  49% {
    opacity: 0.62;
  }

  52% {
    opacity: 1;
  }
}

.subtitle {
  margin-top: 18px;
  font-size: 16px;
  color: rgba(20,20,20,0.48);
  letter-spacing: 1px;
  transition: color 1.2s ease;
  animation: subtitleAppear 4s ease forwards;
}

body.awake .subtitle {
  color: rgba(232,232,232,0.48);
}

@keyframes subtitleAppear {
  from { opacity: 0; }
  to { opacity: 1; }
}

@media (max-width: 600px) {
  #homeBtn {
    font-size: 30px;
    top: 10px;
    left: 12px;
  }

  #startBtn {
    font-size: 30px;
  }

  .subtitle {
    font-size: 14px;
  }
}
</style>
</head>

<body>

<canvas id="matrixRain"></canvas>
<div class="screenFlicker"></div>

<a href="index.html" id="homeBtn">道</a>

<audio id="brownNoise" src="brown-noise.mp3" loop></audio>

<div class="center">
  <button id="startBtn">
    CCNA - התחלה
  </button>

  <div class="subtitle" id="subtitle">
    לחץ כדי להיכנס לתודעת הרשת
  </div>
</div>

<script>
const startBtn = document.getElementById("startBtn");
const subtitle = document.getElementById("subtitle");
const brownNoise = document.getElementById("brownNoise");

let isAwake = false;

brownNoise.volume = 0.18;

startBtn.addEventListener("click", () => {
  if (!isAwake) {
    document.body.classList.add("awake");
    subtitle.textContent = "המערכת התעוררה — לחץ שוב כדי להתחיל";
    brownNoise.play().catch(() => {});
    isAwake = true;
  } else {
    window.location.href = "ccna-introduction.html";
  }
});

/* גשם בינארי */
const canvas = document.getElementById("matrixRain");
const ctx = canvas.getContext("2d");

function resizeCanvas() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}

resizeCanvas();
window.addEventListener("resize", resizeCanvas);

const chars = "01";
const fontSize = 18;

let columns = Math.floor(canvas.width / fontSize);
let drops = Array(columns).fill(1);

function resetDrops() {
  columns = Math.floor(canvas.width / fontSize);
  drops = Array(columns).fill(1);
}

window.addEventListener("resize", resetDrops);

function drawMatrixRain() {
  ctx.fillStyle = "rgba(5,5,5,0.08)";
  ctx.fillRect(0,0,canvas.width,canvas.height);

  ctx.fillStyle = "rgba(141,252,255,0.45)";
  ctx.font = fontSize + "px monospace";

  for (let i = 0; i < drops.length; i++) {
    const text = chars[Math.floor(Math.random() * chars.length)];
    ctx.fillText(text, i * fontSize, drops[i] * fontSize);

    if (drops[i] * fontSize > canvas.height && Math.random() > 0.985) {
      drops[i] = 0;
    }

    drops[i]++;
  }
}

setInterval(drawMatrixRain, 55);
</script>

</body>
</html>
