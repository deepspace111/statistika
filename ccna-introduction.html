<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>עטוף בפרוטוקולים</title>

<link href="https://fonts.googleapis.com/css2?family=Yuji+Mai&display=swap" rel="stylesheet">

<style>

body{
    margin:0;
    background:#f2f2f2;
    color:#111;
    font-family:Arial,sans-serif;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    transition:1.2s ease;
    overflow:hidden;
}

/* מצב ריכוז */
body.focus-mode{
    background:#050505;
    color:#f2f2f2;
}

/* קונטיינר */
.wrapper{
    text-align:center;
}

/* היין יאנג */
#yinYang{
    width:340px;
    max-width:85vw;
    transition:1.5s ease;
    filter:grayscale(100%);
}

/* במצב ריכוז - היפוך צבעים */
body.focus-mode #yinYang{
    filter:invert(1) contrast(1.15);
}

/* שורת הפרוטוקולים */
.protocol-line{
    margin-top:28px;
    display:flex;
    justify-content:center;
    align-items:center;
    gap:12px;
    font-size:34px;
    font-weight:300;
    letter-spacing:1px;
}

/* הסמל */
.protocol-icon{
    width:42px;
    opacity:0.85;
    transition:1s ease;
}

body.focus-mode .protocol-icon{
    filter:invert(1);
}

/* כיתוב */
.protocol-text{
    font-family:'Yuji Mai', serif;
}

/* כפתור מצב ריכוז */
.focus-btn{
    margin-top:40px;
    padding:12px 26px;
    border:none;
    background:#111;
    color:#f2f2f2;
    cursor:pointer;
    font-size:16px;
    transition:0.5s ease;
}

body.focus-mode .focus-btn{
    background:#f2f2f2;
    color:#111;
}

</style>
</head>

<body>

<div class="wrapper">

    <!-- תמונת היין יאנג -->
    <img id="yinYang" src="yin-yang.png" alt="yin yang">

    <!-- שורת עטוף בפרוטוקולים -->
    <div class="protocol-line">

        <!-- הסמל -->
        <img class="protocol-icon" src="protocol-icon.png" alt="icon">

        <!-- הטקסט -->
        <div class="protocol-text">
            עטוף בפרוטוקולים
        </div>

    </div>

    <!-- כפתור -->
    <button class="focus-btn" onclick="toggleFocus()">
        תודעת לימוד
    </button>

</div>

<script>

function toggleFocus(){
    document.body.classList.toggle("focus-mode");
}

</script>

</body>
</html>
