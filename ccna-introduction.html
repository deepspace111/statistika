```html
<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>דרך הרשת 🌐</title>

<link href="https://fonts.googleapis.com/css2?family=Yuji+Mai&display=swap" rel="stylesheet">

<style>

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f7f7f7;
  color: #111;
  min-height: 100vh;
  text-align: center;
  line-height: 1.9;
  overflow-x: hidden;
  transition: 0.5s ease;
}

body.learning-mode {
  background: #111;
  color: #f2f2f2;
}

body.soft-entering {
  animation: softPageFade 1.4s ease forwards;
}

.rain {
  position: fixed;
  inset: 0;
  z-index: 1;
  pointer-events: none;
  overflow: hidden;
}

.drop {
  position: absolute;
  top: -120px;
  width: 1px;
  height: 120px;
  background: linear-gradient(
    to bottom,
    rgba(255,255,255,0),
    rgba(70,90,120,0.12),
    rgba(255,255,255,0)
  );
  animation: rain linear infinite;
}

body.learning-mode .drop {
  background: linear-gradient(
    to bottom,
    rgba(255,255,255,0),
    rgba(130,170,255,0.16),
    rgba(255,255,255,0)
  );
}

@keyframes rain {
  from { transform: translateY(-120px); }
  to { transform: translateY(120vh); }
}

#homeBtn {
  position: fixed;
  top: 14px;
  left: 14px;
  text-decoration: none;
  font-family: 'Yuji Mai', serif;
  font-size: 23px;
  color: rgba(50,50,50,0.42);
  z-index: 20;
  opacity: 0;
  animation: fadeInHome 3s ease forwards;
}

body.learning-mode #homeBtn {
  color: rgba(220,220,220,0.40);
}

@keyframes fadeInHome {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 0.72; transform: translateY(0); }
}

#focusBtn {
  position: fixed;
  top: 14px;
  right: 14px;
  border: 1px solid rgba(0,0,0,0.16);
  background: rgba(0,0,0,0.04);
  color: rgba(20,20,20,0.75);
  padding: 7px 12px;
  border-radius: 18px;
  font-size: 13px;
  cursor: pointer;
  z-index: 20;
}

body.learning-mode #focusBtn {
  border: 1px solid rgba(255,255,255,0.18);
  background: rgba(255,255,255,0.04);
  color: rgba(240,240,240,0.75);
}

.container {
  position: relative;
  z-index: 5;
  max-width: 760px;
  margin: 0 auto;
  padding: 80px 24px 70px;
}

h1 {
  font-size: 42px;
  margin-bottom: 55px;
  font-weight: 300;
}

h2 {
  font-size: 25px;
  margin: 50px 0 18px;
  font-weight: 500;
}

p {
  font-size: 20px;
  margin: 14px 0;
}

.section {
  position: relative;
  margin-bottom: 48px;
  padding-top: 34px;
  border-top: 1px solid rgba(0,0,0,0.14);
}

.section:first-of-type {
  border-top: none;
  padding-top: 0;
}

body.learning-mode .section {
  border-top: 1px solid rgba(255,255,255,0.14);
}

.term {
  font-weight: bold;
}

.protocol-station {
  position: relative;
  margin: 14px 0;
  min-height: 170px;
  display: flex;
  align-items: center;
  justify-content: center;
}

.protocol-symbol-link {
  position: absolute;
  right: -155px;
  top: 50%;
  transform: translateY(-50%);
  width: 180px;
  height: auto;
  display: block;
  cursor: pointer;
  z-index: 3;
}

.protocol-symbol {
  width: 180px;
  height: auto;
  opacity: 0.88;
  pointer-events: none;
  transition: 0.7s ease;
  animation: quietBreath 5.5s ease-in-out infinite;
}

.protocol-symbol-link:hover .protocol-symbol {
  transform: scale(1.045);
  opacity: 1;
  filter: drop-shadow(0 0 16px rgba(0,0,0,0.22));
}

body.learning-mode .protocol-symbol {
  filter: invert(1) grayscale(100%);
  opacity: 0.78;
}

body.learning-mode .protocol-symbol-link:hover .protocol-symbol {
  filter: invert(1) grayscale(100%) drop-shadow(0 0 18px rgba(255,255,255,0.28));
  opacity: 0.96;
}

body.soft-entering .protocol-symbol {
  animation: symbolSoftExit 1.4s ease forwards;
}

.do-mark {
  font-family: 'Yuji Mai', serif;
  font-size: 26px;
  color: rgba(80,80,80,0.40);
  opacity: 0;
  animation: fadeInDo 4s ease forwards;
  animation-delay: 1.5s;
  display: block;
  margin-top: 8px;
}

body.learning-mode .do-mark {
  color: rgba(220,220,220,0.38);
}

@keyframes fadeInDo {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 0.72; transform: translateY(0); }
}

.final-line {
  margin-top: 65px;
  font-size: 23px;
  font-weight: bold;
}

.next-btn {
  display: inline-block;
  margin-top: 34px;
  padding: 9px 28px;
  border-radius: 22px;
  border: 1px solid rgba(0,0,0,0.22);
  color: #111;
  text-decoration: none;
  font-size: 18px;
  background: rgba(0,0,0,0.035);
  transition: 0.3s ease;
}

.next-btn:hover {
  background: rgba(0,0,0,0.08);
}

body.learning-mode .next-btn {
  border: 1px solid rgba(255,255,255,0.25);
  color: #f2f2f2;
  background: rgba(255,255,255,0.04);
}

body.learning-mode .next-btn:hover {
  background: rgba(255,255,255,0.09);
}

.soft-fade {
  position: fixed;
  inset: 0;
  background: #000;
  opacity: 0;
  pointer-events: none;
  z-index: 999;
}

body.soft-entering .soft-fade {
  animation: softFade 1.4s ease forwards;
}

@keyframes quietBreath {
  0% { transform: scale(1); }
  50% { transform: scale(1.025); }
  100% { transform: scale(1); }
}

@keyframes symbolSoftExit {
  0% {
    transform: scale(1);
    opacity: 0.9;
  }

  100% {
    transform: scale(1.08);
    opacity: 0.18;
  }
}

@keyframes softFade {
  from { opacity: 0; }
  to { opacity: 1; }
}

@keyframes softPageFade {
  from { filter: none; }
  to { filter: brightness(0.35); }
}

@media (max-width: 600px) {
  h1 { font-size: 34px; }
  h2 { font-size: 22px; }
  p { font-size: 18px; }
  #homeBtn { font-size: 22px; }
  .do-mark { font-size: 24px; }
  #focusBtn { font-size: 12px; padding: 6px 10px; }
  .next-btn { font-size: 17px; padding: 8px 24px; }

  .protocol-station {
    display: block;
    min-height: auto;
    margin: 14px 0;
  }

  .protocol-symbol-link {
    position: static;
    transform: none;
    display: block;
    width: 180px;
    margin: 22px auto 0;
  }

  .protocol-symbol {
    width: 180px;
    opacity: 0.78;
  }
}

</style>
</head>

<body>

<div class="rain" id="rain"></div>

<a href="index.html" id="homeBtn">道</a>
<button id="focusBtn">תודעת לימוד</button>

<audio id="brownNoise" loop>
  <source src="brown-noise.mp3" type="audio/mpeg">
</audio>

<div class="soft-fade"></div>

<div class="container">

<h1>דרך הרשת 🌐</h1>

<div class="section">
<p>הרשת לא מתחילה במקום רחוק.</p>
<p>היא מתחילה כאן —<br>במרחב שלך.</p>
</div>

<div class="section">

<p>
וכך התרשת העולם.
</p>

<p>
רשתות החלו להתחבר אחת לשנייה<br>
ולדבר בעזרת חוקים משותפים.
</p>

<p>
המידע שעבר ביניהן<br>
התפצל, נארז, נשלח, נותב —<br>
ונבנה מחדש בצד השני.
</p>

<p class="final-line">
כשמבינים, רואים את הדרך 🌱
</p>

<p>
<a href="videos/video.html" class="next-btn">המשך</a>
</p>

</div>

</div>

<script>

const rain = document.getElementById("rain");

for(let i=0;i<90;i++){
  const drop = document.createElement("div");
  drop.classList.add("drop");
  drop.style.left = Math.random()*100+"vw";
  drop.style.animationDuration = (4 + Math.random()*7)+"s";
  drop.style.opacity = 0.10 + Math.random()*0.20;
  rain.appendChild(drop);
}

</script>

</body>
</html>
```
