  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>המרחב | way to see</title>

  <link rel="stylesheet" href="waytosee.css">

  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js?onload=onTurnstileLoad&render=explicit" async defer></script>

  <style>

    body{
      padding: 0;
    }

    .space-page{
      position: relative;
      z-index: 5;
      max-width: 620px;
      margin: 0 auto;
      padding: 100px 22px 70px;
    }

    .space-title{
      text-align: center;
      font-size: 15px;
      letter-spacing: 6px;
      text-transform: uppercase;
      font-weight: 300;
      margin-bottom: 10px;
      color: rgba(82,68,54,0.96);
      opacity: 0;
      animation: spaceReveal 1.6s ease-out forwards;
    }

    body.learning-mode .space-title{ color: rgba(240,240,240,0.92); }

    .space-subtitle{
      text-align: center;
      font-size: 20px;
      line-height: 1.6;
      margin-bottom: 10px;
      color: rgba(82,68,54,0.9);
      opacity: 0;
      animation: spaceReveal 2s ease-out forwards;
      animation-delay: 0.15s;
    }

    body.learning-mode .space-subtitle{ color: rgba(225,225,225,0.9); }

    .space-note{
      text-align: center;
      font-size: 14px;
      line-height: 1.9;
      max-width: 420px;
      margin: 0 auto 46px;
      color: rgba(82,68,54,0.55);
      opacity: 0;
      animation: spaceReveal 2.2s ease-out forwards;
      animation-delay: 0.3s;
    }

    body.learning-mode .space-note{ color: rgba(200,200,200,0.55); }

    @keyframes spaceReveal{
      from{ opacity: 0; filter: blur(4px); transform: translateY(6px); }
      to{ opacity: 1; filter: blur(0); transform: translateY(0); }
    }

    .space-status{
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      color: rgba(82,68,54,0.62);
      margin-bottom: 34px;
    }

    body.learning-mode .space-status{ color: rgba(200,200,200,0.62); }

    .space-status .dot{
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #6fbf73;
      box-shadow: 0 0 8px rgba(111,191,115,0.7);
      animation: dotPulse 2.4s ease-in-out infinite;
    }

    @keyframes dotPulse{
      0%,100%{ opacity: 0.55; }
      50%{ opacity: 1; }
    }

    .space-compose{
      background: rgba(255,255,255,0.6);
      border: 1px solid rgba(82,68,54,0.14);
      border-radius: 22px;
      padding: 22px;
      margin-bottom: 54px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.05);
      transition: 0.4s ease;
    }

    body.learning-mode .space-compose{
      background: rgba(255,255,255,0.04);
      border-color: rgba(255,255,255,0.1);
      box-shadow: none;
    }

    .space-compose textarea{
      width: 100%;
      min-height: 92px;
      resize: vertical;
      border: none;
      background: transparent;
      outline: none;
      font-family: inherit;
      font-size: 17px;
      line-height: 1.7;
      color: rgba(40,34,28,0.92);
      box-sizing: border-box;
    }

    body.learning-mode .space-compose textarea{
      color: rgba(235,235,235,0.92);
    }

    .space-compose textarea::placeholder{
      color: rgba(82,68,54,0.4);
    }

    body.learning-mode .space-compose textarea::placeholder{
      color: rgba(200,200,200,0.35);
    }

    .space-compose-row{
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 14px;
      margin-top: 10px;
    }

    .space-send{
      display: inline-block;
      min-width: 100px;
      padding: 11px 26px;
      border: none;
      border-radius: 999px;
      font-size: 16px;
      font-weight: bold;
      font-family: inherit;
      background: linear-gradient(135deg, #111, #333);
      color: white;
      box-shadow: 0 8px 22px rgba(0,0,0,0.22);
      cursor: pointer;
      transition: 0.25s ease;
    }

    .space-send:hover{
      transform: translateY(-2px);
      box-shadow: 0 12px 26px rgba(0,0,0,0.3);
    }

    body.learning-mode .space-send{
      background: linear-gradient(135deg, #e8e8e8, #ffffff);
      color: #111;
      box-shadow: 0 8px 22px rgba(255,255,255,0.1);
    }

    .space-feed-title{
      font-size: 13px;
      letter-spacing: 2px;
      text-transform: uppercase;
      font-weight: 400;
      color: rgba(82,68,54,0.45);
      margin-bottom: 20px;
      padding-bottom: 12px;
      border-bottom: 1px solid rgba(82,68,54,0.14);
    }

    body.learning-mode .space-feed-title{
      color: rgba(200,200,200,0.4);
      border-bottom-color: rgba(255,255,255,0.1);
    }

    .space-feed{
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .space-item{
      padding: 18px 20px;
      border-radius: 16px;
      background: rgba(255,255,255,0.5);
      border: 1px solid rgba(82,68,54,0.1);
      font-size: 17px;
      line-height: 1.75;
      color: rgba(40,34,28,0.9);
    }

    body.learning-mode .space-item{
      background: rgba(255,255,255,0.03);
      border-color: rgba(255,255,255,0.08);
      color: rgba(230,230,230,0.88);
    }

    .space-item.is-new{
      animation: itemArrive 0.5s ease-out;
    }

    @keyframes itemArrive{
      from{ opacity: 0; transform: translateY(-8px); }
      to{ opacity: 1; transform: translateY(0); }
    }

    .space-item time{
      display: block;
      margin-top: 10px;
      font-size: 12px;
      color: rgba(82,68,54,0.42);
    }

    body.learning-mode .space-item time{
      color: rgba(200,200,200,0.4);
    }

    .space-item-actions{
      margin-top: 10px;
      display: flex;
      justify-content: flex-end;
    }

    .space-reply-toggle{
      background: none;
      border: none;
      padding: 0;
      font-family: inherit;
      font-size: 13px;
      color: rgba(82,68,54,0.5);
      cursor: pointer;
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    body.learning-mode .space-reply-toggle{ color: rgba(200,200,200,0.5); }

    .space-reply-compose{
      display: none;
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid rgba(82,68,54,0.1);
    }

    body.learning-mode .space-reply-compose{ border-top-color: rgba(255,255,255,0.08); }

    .space-reply-compose.is-open{ display: block; }

    .space-reply-compose textarea{
      width: 100%;
      min-height: 56px;
      resize: vertical;
      border: 1px solid rgba(82,68,54,0.14);
      border-radius: 12px;
      background: rgba(255,255,255,0.5);
      outline: none;
      font-family: inherit;
      font-size: 15px;
      line-height: 1.6;
      color: rgba(40,34,28,0.92);
      padding: 10px 12px;
      box-sizing: border-box;
    }

    body.learning-mode .space-reply-compose textarea{
      background: rgba(255,255,255,0.04);
      border-color: rgba(255,255,255,0.1);
      color: rgba(235,235,235,0.92);
    }

    .space-reply-compose-row{
      display: flex;
      justify-content: flex-end;
      margin-top: 8px;
    }

    .space-reply-send{
      padding: 7px 18px;
      border: none;
      border-radius: 999px;
      font-size: 13px;
      font-weight: bold;
      font-family: inherit;
      background: linear-gradient(135deg, #111, #333);
      color: white;
      cursor: pointer;
    }

    body.learning-mode .space-reply-send{
      background: linear-gradient(135deg, #e8e8e8, #ffffff);
      color: #111;
    }

    .space-replies{
      margin-top: 14px;
      padding-right: 18px;
      border-right: 2px solid rgba(82,68,54,0.12);
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    body.learning-mode .space-replies{ border-right-color: rgba(255,255,255,0.1); }

    .space-reply-item{
      padding: 12px 14px;
      border-radius: 12px;
      background: rgba(255,255,255,0.35);
      border: 1px solid rgba(82,68,54,0.08);
      font-size: 15px;
      line-height: 1.65;
      color: rgba(40,34,28,0.88);
    }

    body.learning-mode .space-reply-item{
      background: rgba(255,255,255,0.025);
      border-color: rgba(255,255,255,0.06);
      color: rgba(225,225,225,0.85);
    }

    .space-reply-item time{
      display: block;
      margin-top: 6px;
      font-size: 11px;
      color: rgba(82,68,54,0.4);
    }

    body.learning-mode .space-reply-item time{
      color: rgba(200,200,200,0.38);
    }

    .space-footer{
      text-align: center;
      font-size: 13px;
      line-height: 2;
      color: rgba(82,68,54,0.4);
      margin-top: 50px;
    }

    body.learning-mode .space-footer{
      color: rgba(200,200,200,0.4);
    }

    @media (max-width: 600px){
      .space-page{ padding: 86px 16px 50px; }
      .space-subtitle{ font-size: 17px; }
      .space-compose{ padding: 16px; border-radius: 18px; }
      .space-item{ padding: 15px 16px; font-size: 16px; }
    }

  </style>
</head>

<body>

  <div class="space-page">

    <div class="space-title">המרחב</div>
    <div class="space-note">בלי שם משתמש, בלי לייקים. רק מה שרצית להגיד, ואפשר גם להגיב למה שאחרים כתבו — וה־AI בודק רק שאין גזענות, איומים, אלימות או עידוד לעבירה.</div>

    <div class="space-status">
      <span class="dot"></span>
      <span>הכתיבה פתוחה</span>
    </div>

    <div class="space-compose">
      <textarea id="spaceInput" maxlength="400" placeholder="תכתוב מה שבא לך"></textarea>
      <div id="turnstileBox"></div>
      <div class="space-compose-row">
        <button class="space-send" id="spaceSend">שלח</button>
      </div>
    </div>

    <div class="space-feed-title">מה שנכתב היום</div>

    <div class="space-feed" id="spaceFeed">
    </div>

  </div>

<script>
  // כתובת ה-Worker שקיבלת מ-Cloudflare (Workers & Pages -> ה-Worker שלך -> Copy)
  const WORKER_URL = "https://red-salad-5a6d.nyceve.workers.dev";

  function getClientId() {
    let id = localStorage.getItem("spaceClientId");
    if (!id) {
      id = crypto.randomUUID();
      localStorage.setItem("spaceClientId", id);
    }
    return id;
  }

  let currentTurnstileToken = "";
  function onTurnstileToken(token) {
    currentTurnstileToken = token;
  }
  // הטוקן פוקע אחרי כמה דקות, ולפעמים הבדיקה עצמה נכשלת (רשת וכו') -
  // בשני המקרים מאפסים כדי שהכפתור ידע שהאימות כבר לא תקף ויבקש אימות מחדש
  function onTurnstileExpired() {
    currentTurnstileToken = "";
  }
  function onTurnstileError() {
    currentTurnstileToken = "";
  }

  let turnstileWidgetId = null;

  function currentTurnstileTheme() {
    return document.body.classList.contains("learning-mode") ? "dark" : "light";
  }

  function renderTurnstile() {
    if (!window.turnstile) return;
    if (turnstileWidgetId !== null) {
      turnstile.remove(turnstileWidgetId);
      currentTurnstileToken = "";
    }
    turnstileWidgetId = turnstile.render("#turnstileBox", {
      sitekey: "0x4AAAAAAEyVwzWvL5D8ur4H",
      action: "post_message",
      theme: currentTurnstileTheme(),
      callback: onTurnstileToken,
      "expired-callback": onTurnstileExpired,
      "error-callback": onTurnstileError,
    });
  }

  function onTurnstileLoad() {
    renderTurnstile();
    renderTurnstile.lastTheme = currentTurnstileTheme();
    const observer = new MutationObserver(() => {
      const wanted = currentTurnstileTheme();
      if (renderTurnstile.lastTheme !== wanted) {
        renderTurnstile.lastTheme = wanted;
        renderTurnstile();
      }
    });
    observer.observe(document.body, { attributes: true, attributeFilter: ["class"] });
  }

  function formatRelativeTime(ms) {
    const diff = Date.now() - ms;
    const minutes = Math.floor(diff / 60000);
    if (minutes < 1) return "לפני רגע";
    if (minutes < 60) return `לפני ${minutes} דקות`;
    const hours = Math.floor(minutes / 60);
    return `לפני ${hours} שעות`;
  }

  // בונה את ה-DOM של הודעה בודדת. תמיד בונים את תוכן ההודעה עם textContent
  // (לא innerHTML) - כי זה טקסט שמשתמשים כתבו, וזה מה ששומר עלינו מ-XSS.
  // רק הודעות ראשיות (isReply=false) מקבלות כפתור "הגב", תיבת תגובות ואת
  // תיבת ההגבה עצמה - כי מגבילים בכוונה לרמת הגבה אחת בלבד.
  function buildMessageEl(m, isReply) {
    const item = document.createElement("div");
    item.className = isReply ? "space-reply-item" : "space-item";
    item.dataset.id = m.id;

    const span = document.createElement("span");
    span.textContent = m.content;
    item.appendChild(span);

    const time = document.createElement("time");
    time.textContent = formatRelativeTime(m.created_at);
    item.appendChild(time);

    if (isReply) return item;

    const actions = document.createElement("div");
    actions.className = "space-item-actions";
    const toggle = document.createElement("button");
    toggle.type = "button";
    toggle.className = "space-reply-toggle";
    toggle.textContent = "הגב";
    actions.appendChild(toggle);
    item.appendChild(actions);

    if (m.replies && m.replies.length) {
      const repliesBox = document.createElement("div");
      repliesBox.className = "space-replies";
      m.replies.forEach((r) => repliesBox.appendChild(buildMessageEl(r, true)));
      item.appendChild(repliesBox);
    }

    const compose = document.createElement("div");
    compose.className = "space-reply-compose";

    const textarea = document.createElement("textarea");
    textarea.maxLength = 400;
    textarea.placeholder = "כתוב תגובה...";
    compose.appendChild(textarea);

    const row = document.createElement("div");
    row.className = "space-reply-compose-row";
    const sendBtn = document.createElement("button");
    sendBtn.type = "button";
    sendBtn.className = "space-reply-send";
    sendBtn.textContent = "שלח תגובה";
    row.appendChild(sendBtn);
    compose.appendChild(row);
    item.appendChild(compose);

    toggle.addEventListener("click", () => {
      compose.classList.toggle("is-open");
      if (compose.classList.contains("is-open")) textarea.focus();
    });

    sendBtn.addEventListener("click", async () => {
      const text = textarea.value.trim();
      if (!text) return;
      const ok = await sendMessage(text, m.id, sendBtn);
      if (ok) {
        textarea.value = "";
        compose.classList.remove("is-open");
      }
    });

    return item;
  }

  function renderFeed(messages) {
    const feed = document.getElementById("spaceFeed");
    feed.replaceChildren();
    messages.forEach((m) => feed.appendChild(buildMessageEl(m, false)));
  }

  async function loadFeed() {
    try {
      const res = await fetch(`${WORKER_URL}/messages`);
      const data = await res.json();
      renderFeed(data.messages || []);
    } catch (e) {
      console.warn("שגיאה בטעינת הפיד:", e);
    }
  }

  // שולח הודעה ראשית (parentId ריק) או תגובה (parentId = מזהה ההודעה שעליה מגיבים).
  // אותה לוגיקה בדיוק משמשת גם את תיבת הכתיבה הראשית וגם כל תיבת "הגב" - הן חולקות
  // את אותו טוקן Turnstile יחיד שבעמוד. מחזיר true/false כדי שהקורא ידע אם לנקות
  // את תיבת הטקסט שלו.
  async function sendMessage(text, parentId, button) {
    if (!currentTurnstileToken) {
      alert("רגע - האימות עדיין לא הושלם, נסה שוב בעוד שנייה.");
      return false;
    }

    if (button) button.disabled = true;
    let success = false;

    try {
      const res = await fetch(`${WORKER_URL}/messages`, {
        method: "POST",
        headers: { "Content-Type": "application/json", "X-Space-Client": getClientId() },
        body: JSON.stringify({
          text,
          parentId: parentId || null,
          turnstileToken: currentTurnstileToken,
          clientId: getClientId(),
        }),
      });
      const data = await res.json();

      if (data.status === "published") {
        success = true;
        loadFeed();
      } else if (data.status === "blocked") {
        alert("ההודעה לא פורסמה - היא נחסמה על ידי המודרציה. (סיבה: " + data.reason + ")");
      } else if (data.reason === "rate_limited" || data.reason === "rate_limited_strict") {
        alert("שלחת יותר מדי הודעות בשעה האחרונה - נסה שוב מאוחר יותר.");
      } else if (data.reason === "parent_not_found") {
        alert("ההודעה שהגבת עליה כבר לא קיימת (כנראה נמחקה אחרי 24 שעות).");
      } else {
        alert("משהו השתבש, נסה שוב.");
      }
    } catch (e) {
      alert("לא הצלחנו להתחבר לשרת. נסה שוב בעוד רגע.");
    } finally {
      if (button) button.disabled = false;
      if (window.turnstile) window.turnstile.reset();
      currentTurnstileToken = "";
    }

    return success;
  }

  document.getElementById("spaceSend").addEventListener("click", async () => {
    const input = document.getElementById("spaceInput");
    const text = input.value.trim();
    if (!text) return;
    const button = document.getElementById("spaceSend");
    const ok = await sendMessage(text, null, button);
    if (ok) input.value = "";
  });

  loadFeed();
  setInterval(loadFeed, 60000); // רענון הפיד כל דקה
</script>

<script src="waytosee.js"></script>

</body>
