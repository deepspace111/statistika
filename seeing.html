<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>המידע משנה צורתו</title>

<style>
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#111;
  color:#eee;
  min-height:100vh;
  overflow:hidden;
}

.scene{
  height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
  gap:25px;
}

.stage{
  width:90%;
  max-width:900px;
  height:420px;
  border:1px solid #333;
  border-radius:24px;
  background:#181818;
  position:relative;
  overflow:hidden;
  box-shadow:0 0 40px #000;
}

.person{
  position:absolute;
  bottom:40px;
  font-size:70px;
}

.boy{ right:70px; }
.girl{ left:70px; }

.computer{
  position:absolute;
  bottom:55px;
  right:190px;
  width:170px;
  height:110px;
  border-radius:14px;
  background:#2b2b2b;
  border:2px solid #555;
}

.message{
  position:absolute;
  top:45px;
  right:40px;
  left:40px;
  height:90px;
  border-radius:20px;
  background:#eee;
  color:#111;
  font-size:55px;
  display:flex;
  align-items:center;
  justify-content:center;
  transition:1s;
}

button{
  padding:14px 30px;
  border:0;
  border-radius:999px;
  font-size:22px;
  cursor:pointer;
  background:#eee;
  color:#111;
}

.caption{
  font-size:24px;
  opacity:.9;
  min-height:34px;
}

.bits{
  position:absolute;
  inset:0;
  display:none;
  align-items:center;
  justify-content:center;
  font-size:26px;
  color:#6fd0ff;
  letter-spacing:7px;
  animation:flow 2s linear infinite;
  white-space:nowrap;
}

@keyframes flow{
  from{ transform:translateX(450px); opacity:.2; }
  50%{ opacity:1; }
  to{ transform:translateX(-450px); opacity:.2; }
}

.pixel{
  animation:pixelate 1.5s forwards;
}

@keyframes pixelate{
  0%{ filter:none; transform:scale(1); }
  40%{ filter:blur(2px); transform:scale(1.1); }
  100%{ filter:blur(8px); opacity:0; transform:scale(.4); }
}

.received{
  right:auto;
  left:150px;
  top:80px;
  font-size:55px;
}

.angry{
  animation:angry .8s infinite alternate;
}

@keyframes angry{
  from{ transform:translateY(0); }
  to{ transform:translateY(-8px); }
}

.home{
  position:fixed;
  top:18px;
  left:18px;
  color:#eee;
  text-decoration:none;
  font-size:28px;
  opacity:.7;
}

.footer{
  position:fixed;
  bottom:25px;
  width:100%;
  text-align:center;
  font-size:22px;
  color:#aaa;
}
</style>
</head>

<body>

<a class="home" href="index.html">道</a>

<div class="scene">
  <div class="stage">
    <div class="message" id="message">🌺</div>

    <div class="person boy">😊</div>
    <div class="computer"></div>
    <div class="person girl" id="girl">🙂</div>

    <div class="bits" id="bits">
      01001000 10110100 00101101 11100010 01010101 00011101
    </div>
  </div>

  <button onclick="startAnimation()">שלח במייל</button>
  <div class="caption" id="caption">הבחור שמח. ההודעה מוכנה.</div>
</div>

<div class="footer">
  המידע משנה את צורתו — מתפצל — עובר — ומתגבש מחדש
</div>

<script>
function startAnimation(){
  const msg = document.getElementById("message");
  const bits = document.getElementById("bits");
  const caption = document.getElementById("caption");
  const girl = document.getElementById("girl");

  caption.textContent = "ההודעה מתפקסלת...";
  msg.classList.add("pixel");

  setTimeout(()=>{
    bits.style.display = "flex";
    caption.textContent = "הפרח הופך לאחדות ואפסים...";
  },1400);

  setTimeout(()=>{
    caption.textContent = "המידע עובר דרך הרשת...";
  },3000);

  setTimeout(()=>{
    bits.style.display = "none";
    msg.classList.remove("pixel");
    msg.classList.add("received");
    msg.style.opacity = "1";
    msg.style.filter = "none";
    msg.style.transform = "scale(1)";
    caption.textContent = "ההודעה מתקבלת אצל רעות.";
  },5000);

  setTimeout(()=>{
    girl.textContent = "😠";
    girl.classList.add("angry");
    caption.textContent = "רעות: למה שלחת לי את הפרח הזה?!";
  },6500);
}
</script>

</body>
</html>
