<script>

const focusBtn = document.getElementById("focusBtn");
const brownNoise = document.getElementById("brownNoise");

/* מצב לימוד = שחור + רעש */

function turnLearningOn() {

  document.body.classList.remove("learning-mode");

  localStorage.setItem("learningMode", "on");

  brownNoise.volume = 0.18;

  brownNoise.play().catch(() => {});
}

/* מצב רגיל = לבן בלי רעש */

function turnLearningOff() {

  document.body.classList.add("learning-mode");

  localStorage.setItem("learningMode", "off");

  brownNoise.pause();
}

/* טעינת מצב שמור */

if (localStorage.getItem("learningMode") === "on") {

  document.body.classList.remove("learning-mode");

} else {

  document.body.classList.add("learning-mode");
}

focusBtn.addEventListener("click", () => {

  if (document.body.classList.contains("learning-mode")) {

    turnLearningOn();

  } else {

    turnLearningOff();
  }
});

</script>
