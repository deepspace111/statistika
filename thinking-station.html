<!DOCTYPE html>
<html lang="he" dir="rtl">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport"
  content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

  <title>תחנת חשיבה</title>

  <link href="https://fonts.googleapis.com/css2?family=Yuji+Mai&display=swap" rel="stylesheet">

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    html,
    body{

      width:100%;
      height:100%;

      overflow:hidden;

      font-family:Arial,sans-serif;

      background:#000;

      color:white;

      overscroll-behavior:none;
      touch-action:none;
    }

    body{
      position:relative;
    }

    /* התמונה כרקע קבוע */

    .thinking-bg{

      position:fixed;

      inset:0;

      background-image:
      url("thinking-station.png?v=6");

      background-repeat:no-repeat;

      background-position:center center;

      background-size:contain;

      background-color:#000;

      z-index:1;

      animation:bgFade 2.5s ease forwards;
    }

    /* שכבת עומק */

    .overlay{

      position:fixed;

      inset:0;

      background:
      radial-gradient(circle at center,
      rgba(0,0,0,0.04),
      rgba(0,0,0,0.72));

      z-index:2;

      pointer-events:none;
    }

    /* גשם */

    .rain{

      position:fixed;

      inset:0;

      overflow:hidden;

      pointer-events:none;

      z-index:3;
    }

    .drop{

      position:absolute;

      top:-120px;

      width:1px;
      height:120px;

      background:linear-gradient(
      to bottom,
      rgba(255,255,255,0),
      rgba(130,170,255,0.14),
      rgba(255,255,255,0));

      animation:rain linear infinite;
    }

    /* דו */

    .do-symbol{

      position:fixed;

      top:20px;
      left:24px;

      font-family:'Yuji Mai',serif;

      font-size:42px;

      color:rgba(255,255,255,0.72);

      text-decoration:none;

      z-index:10;

      transition:0.4s ease;
    }

    .do-symbol:hover{

      color:white;

      transform:scale(1.08);
    }

    /* תודעת חשיבה */

    .mind-btn{

      position:fixed;

      top:50%;
      right:12px;

      transform:translateY(-50%);

      writing-mode:vertical-rl;

      text-orientation:mixed;

      padding:18px 9px;

      border:1px solid rgba(255,255,255,0.14);

      border-radius:999px;

      background:rgba(0,0,0,0.22);

      backdrop-filter:blur(10px);

      color:#e8e8e8;

      font-size:12px;

      letter-spacing:2px;

      cursor:pointer;

      z-index:10;

      transition:0.4s ease;
    }

    .mind-btn:hover{

      background:
      rgba(255,255,255,0.05);

      border-color:
      rgba(255,255,255,0.22);
    }

    /* משפט */

    .quote{

      position:fixed;

      bottom:34px;

      left:50%;

      transform:translateX(-50%);

      text-align:center;

      font-size:20px;

      letter-spacing:1px;

      color:rgba(255,255,255,0.82);

      z-index:10;

      animation:fadeText 4s ease forwards;
    }

    .quote small{

      display:block;

      margin-top:10px;

      font-size:14px;

      color:rgba(255,255,255,0.42);
    }

    /* מצב תודעת חשיבה */

    body.deep-mode .overlay{

      background:
      radial-gradient(circle at center,
      rgba(0,0,0,0.18),
      rgba(0,0,0,0.82));
    }

    /* אנימציות */

    @keyframes bgFade{

      from{
        opacity:0;
      }

      to{
        opacity:1;
      }
    }

    @keyframes fadeText{

      from{
        opacity:0;
        transform:
        translateX(-50%)
        translateY(12px);
      }

      to{
        opacity:1;
        transform:
        translateX(-50%)
        translateY(0);
      }
    }

    @keyframes rain{

      from{
        transform:translateY(-120px);
      }

      to{
        transform:translateY(120svh);
      }
    }

    /* מובייל */

    @media(max-width:768px){

      .thinking-bg{

        background-size:contain;
      }

      .quote{

        width:88%;

        font-size:16px;

        bottom:20px;
      }

      .do-symbol{

        font-size:34px;
      }

      .mind-btn{

        right:7px;

        font-size:11px;

        padding:15px 8px;

        letter-spacing:1px;
      }
    }

  </style>
</head>

<body>

  <!-- רקע -->

  <div class="thinking-bg"></div>

  <!-- שכבת עומק -->

  <div class="overlay"></div>

  <!-- גשם -->

  <div class="rain" id="rain"></div>

  <!-- דו -->

  <a href="index.html"
  class="do-symbol">道</a>

  <!-- תודעת חשיבה -->

  <button class="mind-btn"
  id="mindBtn">

    תודעת חשיבה

  </button>

  <!-- משפט -->

  <div class="quote">

    המידע מתעטף בשכבות פרוטוקולים

    <small>

      כשמבינים רואים

    </small>

  </div>

  <!-- רעש חום -->

  <audio id="brownNoise" loop>

    <source src="brown-noise.mp3"
    type="audio/mpeg">

  </audio>

  <script>

    /* גשם */

    const rain =
    document.getElementById("rain");

    for(let i=0;i<120;i++){

      const drop =
      document.createElement("div");

      drop.classList.add("drop");

      drop.style.left =
      Math.random()*100+"vw";

      drop.style.animationDuration =
      (3 + Math.random()*5)+"s";

      drop.style.opacity =
      0.15 + Math.random()*0.22;

      rain.appendChild(drop);
    }

    /* תודעת חשיבה */

    const btn =
    document.getElementById("mindBtn");

    const audio =
    document.getElementById("brownNoise");

    let active = false;

    btn.addEventListener("click",()=>{

      active = !active;

      document.body.classList.toggle("deep-mode");

      if(active){

        audio.volume = 0.45;

        audio.play().catch(()=>{});

      }else{

        audio.pause();
      }

    });

  </script>

</body>
</html>
