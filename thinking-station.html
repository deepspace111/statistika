<!DOCTYPE html>
<html lang="he" dir="rtl">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>תחנת חשיבה</title>

  <link href="https://fonts.googleapis.com/css2?family=Yuji+Mai&display=swap" rel="stylesheet">

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body{
      overflow:hidden;
      background:#04070d;
      font-family:Arial,sans-serif;
      height:100vh;
      width:100vw;
      color:white;
      overscroll-behavior:none;
      touch-action:manipulation;
    }

    .background{
      position:fixed;
      inset:0;
      background:#04070d;
      z-index:1;
    }

    .thinking-image{
      position:fixed;
      top:50%;
      left:50%;
      transform:translate(-50%,-50%);

      width:82vw;
      max-width:1350px;
      height:auto;

      opacity:0;

      animation:
      fadeIn 2.5s ease forwards,
      breathing 12s ease-in-out infinite;

      filter:
      drop-shadow(0 0 40px rgba(130,170,255,0.10))
      brightness(1.02);

      z-index:2;
    }

    .overlay{
      position:fixed;
      inset:0;
      background:
      radial-gradient(circle at center,
      rgba(0,0,0,0.05),
      rgba(0,0,0,0.35));
      z-index:3;
      pointer-events:none;
    }

    .rain{
      position:fixed;
      inset:0;
      z-index:4;
      pointer-events:none;
      overflow:hidden;
    }

    .drop{
      position:absolute;
      top:-120px;
      width:1px;
      height:120px;
      background:linear-gradient(
      to bottom,
      rgba(255,255,255,0),
      rgba(130,170,255,0.18),
      rgba(255,255,255,0));
      animation:rain linear infinite;
    }

    .do-symbol{
      position:fixed;
      top:20px;
      left:24px;
      font-family:'Yuji Mai',serif;
      font-size:42px;
      color:rgba(255,255,255,0.75);
      text-decoration:none;
      z-index:10;
      transition:0.4s ease;
    }

    .do-symbol:hover{
      color:white;
      transform:scale(1.08);
    }

    .mind-btn{
      position:fixed;
      top:24px;
      right:24px;
      padding:12px 22px;
      border:1px solid rgba(255,255,255,0.18);
      border-radius:999px;
      background:rgba(0,0,0,0.25);
      backdrop-filter:blur(10px);
      color:#e8e8e8;
      font-size:15px;
      cursor:pointer;
      z-index:10;
      transition:0.4s ease;
    }

    .mind-btn:hover{
      background:rgba(255,255,255,0.08);
      border-color:rgba(255,255,255,0.28);
    }

    .quote{
      position:fixed;
      bottom:38px;
      left:50%;
      transform:translateX(-50%);
      font-size:20px;
      letter-spacing:1px;
      color:rgba(255,255,255,0.82);
      z-index:10;
      text-align:center;
      animation:fadeText 4s ease forwards;
    }

    .quote small{
      display:block;
      margin-top:10px;
      font-size:14px;
      color:rgba(255,255,255,0.45);
    }

    body.deep-mode .overlay{
      background:
      radial-gradient(circle at center,
      rgba(0,0,0,0.20),
      rgba(0,0,0,0.62));
    }

    body.deep-mode .thinking-image{
      filter:
      drop-shadow(0 0 55px rgba(130,170,255,0.16))
      brightness(1.06);
    }

    @keyframes fadeIn{
      from{
        opacity:0;
        transform:translate(-50%,-50%) scale(1.02);
      }

      to{
        opacity:1;
        transform:translate(-50%,-50%) scale(1);
      }
    }

    @keyframes fadeText{
      from{
        opacity:0;
        transform:translateX(-50%) translateY(12px);
      }

      to{
        opacity:1;
        transform:translateX(-50%) translateY(0);
      }
    }

    @keyframes rain{
      from{
        transform:translateY(-120px);
      }

      to{
        transform:translateY(120vh);
      }
    }

    @keyframes breathing{
      0%{
        transform:translate(-50%,-50%) scale(1);
      }

      50%{
        transform:translate(-50%,-50%) scale(1.015);
      }

      100%{
        transform:translate(-50%,-50%) scale(1);
      }
    }

    @media(max-width:768px){

      .thinking-image{
        position:fixed;
        height:100vh;
        width:auto;
        max-width:none;
        max-height:none;
      }

      .quote{
        width:90%;
        font-size:17px;
        bottom:22px;
      }

      .mind-btn{
        font-size:13px;
        padding:10px 16px;
      }

      .do-symbol{
        font-size:34px;
      }
    }

  </style>
</head>

<body>

  <div class="background"></div>

  <img class="thinking-image"
  src="thinking-station.png"
  alt="המידע מתעטף בשכבות פרוטוקולים">

  <div class="overlay"></div>

  <div class="rain" id="rain"></div>

  <a href="index.html" class="do-symbol">道</a>

  <button class="mind-btn" id="mindBtn">
    תודעת חשיבה
  </button>

  <div class="quote">
    המידע מתעטף בשכבות פרוטוקולים

    <small>
      כשמבינים רואים
    </small>
  </div>

  <audio id="brownNoise" loop>
    <source src="brown-noise.mp3" type="audio/mpeg">
  </audio>

  <script>

    const rain = document.getElementById("rain");

    for(let i=0;i<120;i++){

      const drop = document.createElement("div");

      drop.classList.add("drop");

      drop.style.left = Math.random()*100+"vw";

      drop.style.animationDuration =
      (3 + Math.random()*5)+"s";

      drop.style.opacity =
      0.15 + Math.random()*0.25;

      rain.appendChild(drop);
    }

    const btn = document.getElementById("mindBtn");
    const audio = document.getElementById("brownNoise");

    let active = false;

    btn.addEventListener("click",()=>{

      active = !active;

      document.body.classList.toggle("deep-mode");

      if(active){

        audio.volume = 0.45;

        audio.play().catch(()=>{});

      }else{

        audio.pause();
      }

    });

  </script>

</body>
</html>
